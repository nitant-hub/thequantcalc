<div class="cf-container">
  <div class="cf-title">👉 Swipe to try similar tools</div>
  <div class="cf-stage" id="cfStage">
    <button class="cf-arrow cf-left" id="cfPrev" aria-label="Previous">&#10094;</button>
    <div class="cf-deck" id="cfDeck">
      <div class="cf-loading">Scanning database...</div>
    </div>
    <button class="cf-arrow cf-right" id="cfNext" aria-label="Next">&#10095;</button>
    <div class="cf-dots" id="cfDots"></div>
  </div>
</div>

<style>
  .cf-container { margin-top: 40px; padding: 10px 0; user-select: none; }
  .cf-title { font-size: 18px; font-weight: bold; margin-bottom: 12px; color: #333; }

  .cf-stage {
    position: relative; height: 500px; background: #000; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    touch-action: pan-y; cursor: grab;
  }
  .cf-stage:active { cursor: grabbing; }
  .cf-deck { position: relative; width: min(300px, 62vw); height: 420px; }
  .cf-loading { color: #aaa; font-style: italic; text-align: center; padding-top: 190px; }

  .cf-card {
    position: absolute; inset: 0; box-sizing: border-box;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    padding: 22px 16px; text-align: center; text-decoration: none; color: #fff;
    border-radius: 0; overflow: hidden; -webkit-user-drag: none;
    transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .45s, filter .45s;
  }
  .cf-icon { position: absolute; top: 20%; left: 0; right: 0; font-size: 80px; }
  .cf-name { font-size: 24px; font-weight: 800; line-height: 1.15; margin-bottom: 18px; text-shadow: 0 2px 8px rgba(0,0,0,.45); }
  .cf-btn { background: #ffd400; color: #111; font-weight: 700; font-size: 14px; padding: 10px 22px; border-radius: 0; }
  .cf-card:not(.cf-active) .cf-btn { visibility: hidden; }

  .cf-arrow {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 200;
    background: none; border: 0; color: #fff; font-size: 34px; cursor: pointer; padding: 14px;
  }
  .cf-left { left: 6px; }
  .cf-right { right: 6px; }

  .cf-dots { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; }
  .cf-dots i { width: 18px; height: 3px; background: #555; }
  .cf-dots i.cf-on { background: #ffd400; }

  @media (max-width: 768px) {
    .cf-stage { height: 460px; }
    .cf-deck { height: 380px; }
    .cf-arrow { font-size: 26px; padding: 8px; }
  }
  @media (prefers-reduced-motion: reduce) { .cf-card { transition: none; } }
</style>

<script>
  document.addEventListener("DOMContentLoaded", async function () {
    const deck = document.getElementById('cfDeck');
    const currentUrl = window.location.pathname;

    // Auto-detect category
    let categoryKeyword = "";
    let icon = "🛠️";
    if (currentUrl.includes("finance")) { categoryKeyword = "finance"; icon = "💰"; }
    else if (currentUrl.includes("health")) { categoryKeyword = "health"; icon = "❤️"; }
    else if (currentUrl.includes("math")) { categoryKeyword = "math"; icon = "🧮"; }

    // Card color pairs (gradient start, end)
    const palette = [
      ["#1b6ca8", "#0b2a4a"], ["#c2410c", "#4a1d0b"], ["#15803d", "#0a3a1f"],
      ["#7e22ce", "#2e0f4d"], ["#0f766e", "#073b37"], ["#b91c1c", "#470c0c"],
      ["#a16207", "#432a05"], ["#1d4ed8", "#0b1f5e"]
    ];

    try {
      // Check local device memory first
      let xmlText = null;
      try { xmlText = sessionStorage.getItem('cachedSitemap'); } catch (e) {}

      if (!xmlText) {
        const response = await fetch('/sitemap-pages.xml');
        xmlText = await response.text();
        try { sessionStorage.setItem('cachedSitemap', xmlText); } catch (e) {}
      }

      const xmlDoc = new DOMParser().parseFromString(xmlText, "text/xml");
      const urls = xmlDoc.getElementsByTagName("loc");
      const acronyms = ["EMI", "ROI", "CAGR", "SIP", "PPF", "GST", "NPV", "IRR", "FD", "RD", "BMI", "BMR", "TDS", "EPF"];

      let matchedLinks = [];
      for (let i = 0; i < urls.length; i++) {
        const pagePath = new URL(urls[i].textContent).pathname;
        if (pagePath !== currentUrl && pagePath.includes(categoryKeyword)) {
          const rawName = pagePath.replace("/p/", "").replace(".html", "");
          const cleanName = rawName.replace(/finance-|health-|math-/i, "").replace(/-/g, " ");
          const title = cleanName.split(' ').map(function (word) {
            const up = word.toUpperCase();
            return acronyms.includes(up) ? up : word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
          }).join(' ');
          matchedLinks.push({ path: pagePath, title: title });
        }
      }

      // Shuffle and keep 15 cards
      matchedLinks = matchedLinks.sort(function () { return 0.5 - Math.random(); }).slice(0, 15);

      if (!matchedLinks.length) {
        deck.innerHTML = '<div class="cf-loading">No similar tools found.</div>';
        return;
      }
      buildCoverflow(matchedLinks, icon, palette);
    } catch (error) {
      deck.innerHTML = '<div class="cf-loading">More utilities available on homepage.</div>';
    }
  });

  function buildCoverflow(links, icon, palette) {
    const deck = document.getElementById('cfDeck');
    const stage = document.getElementById('cfStage');
    const dotsBox = document.getElementById('cfDots');
    const n = links.length;
    let active = 0, dragging = false, moved = false, startX = 0;

    deck.innerHTML = '';
    links.forEach(function (link, i) {
      const c = palette[i % palette.length];
      const a = document.createElement('a');
      a.className = 'cf-card';
      a.href = link.path;
      a.draggable = false;
      a.style.background = 'linear-gradient(160deg,' + c[0] + ',' + c[1] + ')';
      a.innerHTML = '<div class="cf-icon">' + icon + '</div>' +
                    '<div class="cf-name">' + link.title + '</div>' +
                    '<span class="cf-btn">▷ OPEN TOOL</span>';
      // Side card: bring to center. Center card: follow the link normally.
      a.addEventListener('click', function (e) {
        if (moved) { e.preventDefault(); return; }
        if (i !== active) { e.preventDefault(); go(i); }
      });
      deck.appendChild(a);
      dotsBox.appendChild(document.createElement('i'));
    });

    const cards = deck.children, dots = dotsBox.children;

    function render() {
      const w = deck.offsetWidth;
      for (let i = 0; i < n; i++) {
        const off = ((i - active + n + n / 2) % n) - n / 2;
        const abs = Math.abs(off), c = cards[i];
        const scale = off === 0 ? 1 : Math.max(0.55, 1 - abs * 0.16);
        const x = off * w * 0.62 + (off === 0 ? 0 : (off > 0 ? w * 0.1 : -w * 0.1));
        c.style.transform = 'translateX(' + x + 'px) scale(' + scale + ')';
        c.style.zIndex = 100 - Math.round(abs * 10);
        c.style.opacity = abs > 3 ? 0 : 1;
        c.style.pointerEvents = abs > 3 ? 'none' : 'auto';
        c.style.filter = off === 0 ? 'none' : 'brightness(' + Math.max(0.35, 0.65 - abs * 0.12) + ')';
        c.classList.toggle('cf-active', off === 0);
        dots[i].className = off === 0 ? 'cf-on' : '';
      }
    }
    function go(i) { active = (i + n) % n; render(); }

    document.getElementById('cfPrev').addEventListener('click', function () { go(active - 1); });
    document.getElementById('cfNext').addEventListener('click', function () { go(active + 1); });

    // Swipe / drag (touch + mouse)
    stage.addEventListener('pointerdown', function (e) {
      if (e.target.closest('.cf-arrow')) return;
      dragging = true; moved = false; startX = e.clientX;
    });
    stage.addEventListener('pointermove', function (e) {
      if (dragging && Math.abs(e.clientX - startX) > 8) moved = true;
    });
    stage.addEventListener('pointerup', function (e) {
      if (!dragging) return;
      dragging = false;
      const dx = e.clientX - startX;
      if (dx > 40) go(active - 1);
      else if (dx < -40) go(active + 1);
      setTimeout(function () { moved = false; }, 0);
    });
    stage.addEventListener('pointercancel', function () { dragging = false; });
    window.addEventListener('resize', render);

    render();
  }
</script>
