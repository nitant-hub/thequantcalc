<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reverse Link Price Comparator | thequantcals</title>
  <!-- Absolute path to your root CSS file -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- Top Search Section -->
  <main class="bento-container" style="max-width: 800px; margin: 2rem auto; padding: 1rem;">
    
    <h2>Compare Lowest Prices</h2>
    
    <!-- The Search Box -->
    <div class="search-section" style="margin-bottom: 2rem;">
      <input type="text" id="link-input-a" placeholder="Paste Amazon or Flipkart link here..." style="width: 100%; padding: 1rem; border-radius: 12px; background: #0f172a; color: #fff; border: 1px solid rgba(255,255,255,0.2);">
    </div>

    <!-- Horizontal Bento Grid Output Container -->
    <div id="price-results" style="display: flex; overflow-x: auto; gap: 1rem; padding-bottom: 1rem; scroll-snap-type: x mandatory;">
      <!-- Dynamic Bento cards will appear here when a link is pasted -->
    </div>

  </main>

  <!-- Bottom SEO Article Section -->
  <article style="max-width: 800px; margin: 4rem auto; padding: 1rem;">
    <h1>How the Reverse Price Comparator Works</h1>
    <p>Reverse Link Price Comparator helps you find the lowest prices across multiple platforms instantly. Simply paste any product link above to compare live prices, features, and deals in real-time.</p>
  </article>

  <!-- Absolute path to your root JavaScript file -->
  <script src="/js/script.js"></script>

</body>
</html>
