<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reverse Link Price Comparator | thequantcals</title>
  <!-- Absolute path to your main CSS file at the root -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- 1. The Tool Section (Top) -->
  <main class="bento-container" style="max-width: 800px; margin: 2rem auto; padding: 1rem;">
    
    <h2>Compare Lowest Prices</h2>
    
    <!-- The Search Box -->
    <div class="search-section" style="margin-bottom: 2rem;">
      <input type="text" id="link-input-a" placeholder="Paste Amazon or Flipkart link here..." style="width: 100%; padding: 1rem; border-radius: 12px;">
    </div>

    <!-- The Horizontal Bento Grid Output -->
    <div id="price-results" style="display: flex; overflow-x: auto; gap: 1rem; padding-bottom: 1rem; scroll-snap-type: x mandatory;">
      <!-- JavaScript will inject the 10 glassmorphism price cards here -->
    </div>

  </main>

  <!-- 2. The SEO Article Section (Bottom) -->
  <article style="max-width: 800px; margin: 4rem auto; padding: 1rem;">
    <h1>How the Reverse Price Comparator Works</h1>
    <p>Write your detailed SEO content here. Explain how this tool finds the lowest price across multiple platforms to help users save money...</p>
  </article>

  <!-- 3. Absolute path to your root JavaScript file -->
  <script src="/js/script.js"></script>

</body>
</html>
