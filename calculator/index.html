<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Calculator</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 10px 4px;
    min-height: 100vh;
  }

  .calc-container {
    width: 100%;
    max-width: 620px;
    background: #f1f6fc;
    border: 1px solid #c9dcf0;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* TOP MODE TABS */
  .mode-tabs-wrap {
    display: flex;
    background: #e3edf9;
    border-bottom: 1px solid #bfd6f0;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .mode-tabs-wrap::-webkit-scrollbar {
    display: none;
  }

  .mode-btn {
    padding: 8px 12px;
    font-size: 0.85rem;
    font-weight: 700;
    color: #1e293b;
    border: none;
    border-right: 1px solid #bfd6f0;
    background: transparent;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .mode-btn.active {
    background: #1d68d8;
    color: #ffffff;
  }
  .mode-btn.history-tab {
    margin-left: auto;
    background: #0f172a;
    color: #ffffff;
    border-right: none;
  }

  /* SCREEN DISPLAY */
  .display-box {
    margin: 12px 14px 10px 14px;
    background: #ffffff;
    border: 1px solid #b7cde6;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.04);
  }
  .display-expr {
    height: 34px;
    padding: 6px 12px;
    text-align: right;
    font-size: 1.25rem;
    font-weight: 700;
    color: #0f172a;
    line-height: 1.2;
    overflow-x: auto;
    white-space: nowrap;
  }
  .display-sub {
    height: 38px;
    background: #3f669f;
    padding: 4px 12px;
    text-align: right;
    font-size: 1.05rem;
    font-weight: 600;
    color: #ffffff;
    line-height: 1.4;
    overflow-x: auto;
    white-space: nowrap;
  }

  /* KEYPAD GRID */
  .keypad-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 8px 14px 16px 14px;
  }

  .key {
    height: 48px;
    border-radius: 8px;
    border: 1px solid #adc7e6;
    background: linear-gradient(180deg, #edf5fd 0%, #dbe9f8 100%);
    box-shadow: 0 3px 0 #b3cae3, 0 4px 8px rgba(0, 0, 0, 0.05);
    font-size: 1.25rem;
    font-weight: 700;
    color: #0f172a;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .key:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #b3cae3;
  }

  /* SPECIAL ACTION BUTTONS */
  .key.ac {
    background: linear-gradient(180deg, #ea3a3a 0%, #d32222 100%);
    border-color: #ba1a1a;
    box-shadow: 0 3px 0 #991313;
    color: #ffffff;
    font-size: 1rem;
  }
  .key.ac:active {
    box-shadow: 0 1px 0 #991313;
  }

  .key.back {
    background: linear-gradient(180deg, #f97316 0%, #ea580c 100%);
    border-color: #c2410c;
    box-shadow: 0 3px 0 #9a3412;
    color: #ffffff;
    font-size: 0.95rem;
  }
  .key.back:active {
    box-shadow: 0 1px 0 #9a3412;
  }

  .key.eq {
    background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
    border-color: #1e40af;
    box-shadow: 0 3px 0 #1e3a8a;
    color: #ffffff;
  }
  .key.eq:active {
    box-shadow: 0 1px 0 #1e3a8a;
  }

  .key.op {
    font-size: 1.2rem;
    color: #1e3a8a;
  }

  /* HISTORY PANEL */
  .history-panel {
    display: none;
    max-height: 180px;
    overflow-y: auto;
    padding: 8px 14px;
    background: #e9f2fb;
    border-top: 1px solid #bfd6f0;
    font-size: 0.9rem;
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px dashed #cbd5e1;
    color: #334155;
  }
  .history-item span:last-child {
    font-weight: 700;
    color: #0f172a;
  }
</style>
</head>
<body>

<div class="calc-container" id="calcContainer">
  <!-- TOP MODE TABS -->
  <div class="mode-tabs-wrap">
    <button class="mode-btn active" onclick="switchMode(this, 'Basic')">Basic</button>
    <button class="mode-btn" onclick="switchMode(this, 'Scientific')">Scientific</button>
    <button class="mode-btn" onclick="switchMode(this, 'GATE')">GATE</button>
    <button class="mode-btn" onclick="switchMode(this, 'FX-991CW')">FX-991CW</button>
    <button class="mode-btn" onclick="switchMode(this, 'FX-5800P')">FX-5800P</button>
    <button class="mode-btn" onclick="switchMode(this, 'HP Prime')">HP Prime</button>
    <button class="mode-btn" onclick="switchMode(this, 'TI-84')">TI-84</button>
    <button class="mode-btn history-tab" onclick="toggleHistory()">HISTORY</button>
  </div>

  <!-- DUAL-COLOR DISPLAY -->
  <div class="display-box">
    <div class="display-expr" id="displayExpr">0</div>
    <div class="display-sub" id="displaySub"></div>
  </div>

  <!-- HISTORY DRAWER -->
  <div class="history-panel" id="historyPanel"></div>

  <!-- KEYPAD -->
  <div class="keypad-grid">
    <button class="key ac" onclick="pressAC()">AC</button>
    <button class="key back" onclick="pressBack()">Back</button>
    <button class="key op" onclick="pressOp('%')">%</button>
    <button class="key op" onclick="pressOp('/')">/</button>

    <button class="key" onclick="pressNum('7')">7</button>
    <button class="key" onclick="pressNum('8')">8</button>
    <button class="key" onclick="pressNum('9')">9</button>
    <button class="key op" onclick="pressOp('*')">*</button>

    <button class="key" onclick="pressNum('4')">4</button>
    <button class="key" onclick="pressNum('5')">5</button>
    <button class="key" onclick="pressNum('6')">6</button>
    <button class="key op" onclick="pressOp('-')">-</button>

    <button class="key" onclick="pressNum('1')">1</button>
    <button class="key" onclick="pressNum('2')">2</button>
    <button class="key" onclick="pressNum('3')">3</button>
    <button class="key op" onclick="pressOp('+')">+</button>

    <button class="key" onclick="pressNum('0')">0</button>
    <button class="key" onclick="pressDot()">.</button>
    <button class="key eq" style="grid-column: span 2;" onclick="pressEquals()">=</button>
  </div>
</div>

<script>
  var expr = '';
  var evaluated = false;
  var historyList = [];

  var displayExpr = document.getElementById('displayExpr');
  var displaySub = document.getElementById('displaySub');
  var historyPanel = document.getElementById('historyPanel');

  function sendHeight() {
    var h = document.getElementById('calcContainer').offsetHeight + 24;
    window.parent.postMessage({ frameHeight: h }, '*');
  }

  function updateDisplay() {
    displayExpr.textContent = expr || '0';
    sendHeight();
  }

  function pressNum(num) {
    if (evaluated) {
      expr = '';
      evaluated = false;
    }
    if (expr === '0') expr = '';
    expr += num;
    updateDisplay();
  }

  function pressDot() {
    if (evaluated) {
      expr = '0';
      evaluated = false;
    }
    var tokens = expr.split(/[\+\-\*\/%]/);
    var currentToken = tokens[tokens.length - 1];
    if (!currentToken.includes('.')) {
      expr += (currentToken === '' ? '0.' : '.');
    }
    updateDisplay();
  }

  function pressOp(op) {
    evaluated = false;
    if (!expr) {
      if (op === '-') expr = '-';
      updateDisplay();
      return;
    }
    var lastChar = expr.slice(-1);
    if ('+-*/%'.includes(lastChar)) {
      expr = expr.slice(0, -1) + op;
    } else {
      expr += op;
    }
    updateDisplay();
  }

  function pressAC() {
    expr = '';
    displayExpr.textContent = '0';
    displaySub.textContent = '';
    evaluated = false;
    sendHeight();
  }

  function pressBack() {
    if (evaluated) {
      pressAC();
      return;
    }
    expr = expr.slice(0, -1);
    updateDisplay();
  }

  function pressEquals() {
    if (!expr) return;
    try {
      var sanitized = expr.replace(/%/g, '/100');
      var result = Function('"use strict";return (' + sanitized + ')')();
      
      displaySub.textContent = expr + ' =';
      historyList.unshift({ eq: expr, ans: result });
      renderHistory();

      expr = String(result);
      displayExpr.textContent = expr;
      evaluated = true;
    } catch (e) {
      displayExpr.textContent = 'Error';
      evaluated = true;
    }
    sendHeight();
  }

  function switchMode(btn, mode) {
    document.querySelectorAll('.mode-btn').forEach(function(b) {
      if (!b.classList.contains('history-tab')) b.classList.remove('active');
    });
    btn.classList.add('active');
    displaySub.textContent = mode + ' Mode';
    sendHeight();
  }

  function toggleHistory() {
    if (historyPanel.style.display === 'block') {
      historyPanel.style.display = 'none';
    } else {
      historyPanel.style.display = 'block';
    }
    sendHeight();
  }

  function renderHistory() {
    var html = '';
    historyList.slice(0, 15).forEach(function(item) {
      html += '<div class="history-item"><span>' + item.eq + '</span><span>= ' + item.ans + '</span></div>';
    });
    historyPanel.innerHTML = html || '<div style="color:#64748b;text-align:center;">No recent history</div>';
  }

  window.addEventListener('load', function() {
    sendHeight();
    setTimeout(sendHeight, 200);
  });
  window.addEventListener('resize', sendHeight);
</script>

</body>
</html>
