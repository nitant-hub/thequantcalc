<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Interactive Calculator</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 6px 4px;
    min-height: 100vh;
  }

  .calc-frame {
    width: 100%;
    max-width: 620px;
    background: #eef5fc;
    border: 1.5px solid #bdd6ee;
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(15, 23, 42, 0.06);
    padding: 10px 10px 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* TOP ROW MODE BUTTONS - PURE WHITE BOXES */
  .mode-tabs-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .mode-tabs-bar::-webkit-scrollbar {
    display: none;
  }

  .mode-pill {
    background: #ffffff;
    border: 1.5px solid #a8c5e2;
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 0.85rem;
    font-weight: 700;
    color: #0f172a;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.1s ease;
  }
  .mode-pill.active {
    background: #1967d2 !important;
    border-color: #1454ac !important;
    color: #ffffff !important;
  }

  .mode-pill.history-btn {
    background: #0d1b2a;
    border-color: #0d1b2a;
    color: #ffffff;
    margin-left: auto;
    position: sticky;
    right: 0;
    z-index: 2;
  }

  /* TWO-TONE DISPLAY SCREEN */
  .screen-container {
    border: 1.5px solid #a8c5e2;
    border-radius: 4px;
    overflow: hidden;
    background: #ffffff;
  }
  .screen-top {
    height: 38px;
    background: #ffffff;
    color: #000000;
    font-size: 1.45rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 12px;
    overflow-x: auto;
    white-space: nowrap;
  }
  .screen-bottom {
    height: 48px;
    background: #395c96;
    color: #ffffff;
    font-size: 1.15rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 12px;
    overflow-x: auto;
    white-space: nowrap;
  }

  /* HISTORY DRAWER */
  .history-drawer {
    display: none;
    max-height: 150px;
    overflow-y: auto;
    background: #ffffff;
    border: 1px solid #a8c5e2;
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 0.9rem;
  }
  .history-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px dashed #cbd5e1;
    color: #334155;
  }
  .history-row span:last-child {
    font-weight: 700;
    color: #0f172a;
  }

  /* KEYPAD GRID */
  .keypad-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .btn {
    height: 52px;
    border-radius: 6px;
    border: 1px solid #adcbe8;
    background: linear-gradient(180deg, #edf5fd 0%, #d8e8f8 100%);
    box-shadow: 0 3px 0 #b3cae3, 0 3px 6px rgba(15, 23, 42, 0.05);
    font-size: 1.35rem;
    font-weight: 700;
    color: #0f172a;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.05s ease, box-shadow 0.05s ease;
  }
  .btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #b3cae3;
  }

  /* AC BUTTON - RED */
  .btn.ac {
    background: linear-gradient(180deg, #ea3a3a 0%, #d32222 100%);
    border-color: #ba1a1a;
    box-shadow: 0 3px 0 #991313;
    color: #ffffff;
    font-size: 1.05rem;
  }
  .btn.ac:active {
    box-shadow: 0 1px 0 #991313;
  }

  /* BACK BUTTON - ORANGE */
  .btn.back {
    background: linear-gradient(180deg, #f97316 0%, #ea580c 100%);
    border-color: #c2410c;
    box-shadow: 0 3px 0 #9a3412;
    color: #ffffff;
    font-size: 0.95rem;
  }
  .btn.back:active {
    box-shadow: 0 1px 0 #9a3412;
  }

  /* EQUALS BUTTON - BLUE */
  .btn.eq {
    background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
    border-color: #1e40af;
    box-shadow: 0 3px 0 #1e3a8a;
    color: #ffffff;
  }
  .btn.eq:active {
    box-shadow: 0 1px 0 #1e3a8a;
  }

  .btn.op {
    color: #0f172a;
    font-size: 1.25rem;
  }
</style>
</head>
<body>

<div class="calc-frame" id="calcFrame">
  <!-- MODE TABS (WHITE BUTTONS) -->
  <div class="mode-tabs-bar">
    <button class="mode-pill active" onclick="pickMode(this, 'Basic')">Basic</button>
    <button class="mode-pill" onclick="pickMode(this, 'Scientific')">Scientific</button>
    <button class="mode-pill" onclick="pickMode(this, 'GATE')">GATE</button>
    <button class="mode-pill" onclick="pickMode(this, 'FX-991CW')">FX-991CW</button>
    <button class="mode-pill" onclick="pickMode(this, 'FX-5800P')">FX-5800P</button>
    <button class="mode-pill" onclick="pickMode(this, 'HP Prime')">HP Prime</button>
    <button class="mode-pill" onclick="pickMode(this, 'TI-84')">TI-84</button>
    <button class="mode-pill history-btn" onclick="toggleHistoryDrawer()">HISTORY</button>
  </div>

  <!-- DISPLAY SCREEN -->
  <div class="screen-container">
    <div class="screen-top" id="screenTop">0</div>
    <div class="screen-bottom" id="screenBottom"></div>
  </div>

  <!-- HISTORY DRAWER -->
  <div class="history-drawer" id="historyDrawer"></div>

  <!-- KEYPAD -->
  <div class="keypad-grid">
    <button class="btn ac" onclick="pressAC()">AC</button>
    <button class="btn back" onclick="pressBack()">Back</button>
    <button class="btn op" onclick="pressOp('%')">%</button>
    <button class="btn op" onclick="pressOp('/')">/</button>

    <button class="btn" onclick="pressNum('7')">7</button>
    <button class="btn" onclick="pressNum('8')">8</button>
    <button class="btn" onclick="pressNum('9')">9</button>
    <button class="btn op" onclick="pressOp('*')">*</button>

    <button class="btn" onclick="pressNum('4')">4</button>
    <button class="btn" onclick="pressNum('5')">5</button>
    <button class="btn" onclick="pressNum('6')">6</button>
    <button class="btn op" onclick="pressOp('-')">-</button>

    <button class="btn" onclick="pressNum('1')">1</button>
    <button class="btn" onclick="pressNum('2')">2</button>
    <button class="btn" onclick="pressNum('3')">3</button>
    <button class="btn op" onclick="pressOp('+')">+</button>

    <button class="btn" onclick="pressNum('0')">0</button>
    <button class="btn" onclick="pressDot()">.</button>
    <button class="btn eq" style="grid-column: span 2;" onclick="pressEquals()">=</button>
  </div>
</div>

<script>
  var query = '';
  var isResult = false;
  var logData = [];

  var topEl = document.getElementById('screenTop');
  var bottomEl = document.getElementById('screenBottom');
  var drawerEl = document.getElementById('historyDrawer');
  var frameEl = document.getElementById('calcFrame');

  function resizeParent() {
    var totalHeight = frameEl.offsetHeight + 18;
    window.parent.postMessage({ frameHeight: totalHeight }, '*');
  }

  function renderScreen() {
    topEl.textContent = query || '0';
    resizeParent();
  }

  function pressNum(val) {
    if (isResult) {
      query = '';
      isResult = false;
    }
    if (query === '0') query = '';
    query += val;
    renderScreen();
  }

  function pressDot() {
    if (isResult) {
      query = '0';
      isResult = false;
    }
    var tokens = query.split(/[\+\-\*\/%]/);
    var cur = tokens[tokens.length - 1];
    if (!cur.includes('.')) {
      query += (cur === '' ? '0.' : '.');
    }
    renderScreen();
  }

  function pressOp(op) {
    isResult = false;
    if (!query) {
      if (op === '-') query = '-';
      renderScreen();
      return;
    }
    var last = query.slice(-1);
    if ('+-*/%'.includes(last)) {
      query = query.slice(0, -1) + op;
    } else {
      query += op;
    }
    renderScreen();
  }

  function pressAC() {
    query = '';
    topEl.textContent = '0';
    bottomEl.textContent = '';
    isResult = false;
    resizeParent();
  }

  function pressBack() {
    if (isResult) {
      pressAC();
      return;
    }
    query = query.slice(0, -1);
    renderScreen();
  }

  function pressEquals() {
    if (!query) return;
    try {
      var sanitized = query.replace(/%/g, '/100');
      var ans = Function('"use strict";return (' + sanitized + ')')();
      
      bottomEl.textContent = query + ' =';
      logData.unshift({ q: query, a: ans });
      renderHistory();

      query = String(ans);
      topEl.textContent = query;
      isResult = true;
    } catch (e) {
      topEl.textContent = 'Error';
      isResult = true;
    }
    resizeParent();
  }

  function pickMode(btn, name) {
    document.querySelectorAll('.mode-pill').forEach(function(p) {
      if (!p.classList.contains('history-btn')) p.classList.remove('active');
    });
    btn.classList.add('active');
    bottomEl.textContent = name + ' Mode';
    resizeParent();
  }

  function toggleHistoryDrawer() {
    drawerEl.style.display = drawerEl.style.display === 'block' ? 'none' : 'block';
    resizeParent();
  }

  function renderHistory() {
    var out = '';
    logData.slice(0, 10).forEach(function(item) {
      out += '<div class="history-row"><span>' + item.q + '</span><span>= ' + item.a + '</span></div>';
    });
    drawerEl.innerHTML = out || '<div style="color:#64748b;text-align:center;">No history yet</div>';
  }

  window.addEventListener('load', function() {
    resizeParent();
    setTimeout(resizeParent, 150);
    setTimeout(resizeParent, 500);
  });
  window.addEventListener('resize', resizeParent);
</script>
</body>
</html>
