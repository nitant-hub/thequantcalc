    var S = window.BQScan; if (!S) { return; }
    var wrapR = el('div', 'bq-scan');
    var go = btn('bq-scanb', '', 'Scan the drawing and read it as a maths expression'); var ic = el('span', 'bq-scanic', '⧉'); ic.setAttribute('aria-hidden', 'true'); var gt = el('span', null, 'Scan Drawing'); var sp = el('span', 'bq-spin'); sp.hidden = true;
    go.appendChild(sp); go.appendChild(ic); go.appendChild(gt);
    var res = el('div', 'bq-scanres'); res.hidden = true; res.setAttribute('aria-live', 'polite');
    wrapR.appendChild(go); wrapR.appendChild(res); afterEl.parentNode.insertBefore(wrapR, afterEl.nextSibling);
    var busy = false;
    function show(kind, title, body) {
      res.hidden = false; res.className = 'bq-scanres ' + (kind || ''); res.innerHTML = '';
      res.appendChild(el('div', 'bq-scanh', title)); if (body) { res.appendChild(typeof body === 'string' ? el('div', 'bq-scanp', body) : body); }
      try { res.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) { /* ignore */ }
    }
    function status(code) {
      var m = { runtime: 'Loading the handwriting reader…', models: 'Downloading the reader (about 7 MB, first time only)…', start: 'Starting the reader…', read: 'Reading your handwriting…' };
      gt.textContent = 'Scanning'; show('busy', 'Scanning', m[code] || 'Scanning\u2026');
    }
    function actions(list) {
      var row = el('div', 'bq-scanact');
      list.forEach(function (a) { row.appendChild(btn('bq-scanbtn' + (a[2] ? ' pri' : ''), a[0], a[0], a[1])); }); return row;
    }
    function run() {
      if (busy) { return; }
      var strokes = pad.strokes();
      if (!strokes.length || !S.meaningful(strokes)) { show('warn', 'Nothing to scan', 'Please draw a mathematical expression first.'); return; }
      busy = true; go.disabled = true; sp.hidden = false; ic.hidden = true; gt.textContent = 'Scanning';
      /* let the screen repaint (spinner, hidden old result) before the heavy work starts, so taps feel instant */
      new Promise(function (ok) { requestAnimationFrame(function () { setTimeout(ok, 40); }); }).then(function () { return S.scan(strokes, status); }).then(function (cands) {
        busy = false; go.disabled = false; sp.hidden = true; ic.hidden = false; gt.textContent = 'Scan Drawing';
        if (!cands || !cands.length) { show('warn', 'Scanned Expression', el('div', 'bq-scanp', 'Unable to recognise this expression. Please redraw it or enter the expression manually.')); return; }
        var best = cands[0]; pad.editor.set(best.expr);
        var body = el('div', 'bq-scanbody');
        body.appendChild(el('div', 'bq-scanex', best.expr));
        if (best.warnings && best.warnings.length) { body.appendChild(el('div', 'bq-scanp warn', 'Some symbols may not be supported by the calculator (' + best.warnings.join(', ') + '). Check and edit the expression below.')); }
        else { body.appendChild(el('div', 'bq-scanp', 'Check the expression, correct anything that was misread, then solve it.')); }
        if (cands.length > 1) {
          var alt = el('div', 'bq-scanalt'); alt.appendChild(el('span', null, 'Other readings:'));
          cands.slice(1).forEach(function (c) { alt.appendChild(btn('bq-chip2', c.expr, 'Use this reading: ' + c.expr, function () { pad.editor.set(c.expr); })); });
          body.appendChild(alt);
        }
        body.appendChild(actions([
          ['Edit Expression', function () { pad.editor.input.focus(); }],
          ['Solve', function () { pad.editor.solve(); }, 1],
          ['Scan Again', function () { res.hidden = true; run(); }],
          ['Close', function () { res.hidden = true; }]
        ]));
        show('ok', 'Scanned Expression', body);
      }, function (err) {
        busy = false; go.disabled = false; sp.hidden = true; ic.hidden = false; gt.textContent = 'Scan Drawing';
        show('bad', 'Could not scan', S.friendly(err));
        try { if (window.console) { console.warn('Scan Drawing:', err); } } catch (e) { /* ignore */ }
      });
    }
    go.addEventListener('click', run);
  }

  /* ---------------- Solver ---------------- */
  var SAMPLES = [
    ['basic', 'Evaluate 2^5', 'Evaluate 2⁵'], ['basic', 'Evaluate (3+4)*5-6/2', 'Evaluate (3 + 4) × 5 − 6 ÷ 2'], ['basic', 'Evaluate 1/2+1/3', 'Evaluate 1/2 + 1/3'],
    ['algebra', 'Solve x^2 - 5x + 6 = 0', 'Solve x² − 5x + 6 = 0'], ['algebra', 'Solve 2x + 5 = 15', 'Solve 2x + 5 = 15'], ['algebra', 'Factor 2x^2 + 7x + 3', 'Factor 2x² + 7x + 3'], ['algebra', 'Solve x^3 - 6x^2 + 11x - 6 = 0', 'Solve x³ − 6x² + 11x − 6 = 0'],
    ['geometry', 'A right triangle has legs 3 and 4. Find the hypotenuse.', 'A right triangle has legs 3 and 4. Find the hypotenuse.'], ['geometry', 'A right triangle has legs 5 and 12. Find the hypotenuse.', 'A right triangle has legs 5 and 12. Find the hypotenuse.'],
    ['calculus', 'Differentiate x^3 - 4x^2 + 7x - 2', 'Differentiate x³ − 4x² + 7x − 2'], ['calculus', 'Integrate 3x^2 + 2x', 'Integrate 3x² + 2x'], ['calculus', 'Integrate x^2 from 0 to 3', 'Integrate x² from 0 to 3']
  ];
  var GRADES = [['all', 'All grades'], ['basic', 'Basic Math & Exponents'], ['algebra', 'Algebra & Quadratics'], ['geometry', 'Geometry Word Problems'], ['calculus', 'Calculus (Derivatives & Integrals)']];
  var KEYS = {
    'Basic & Algebra': [['x²', '^2'], ['xⁿ', '^'], ['√( )', 'sqrt()', -1], ['ᵃ/ᵇ', '()/()', -4], ['π', 'pi'], ['=', ' = '], ['x', 'x'], ['y', 'y'], ['(', '('], [')', ')'], ['+', ' + '], ['−', ' - '], ['×', '*'], ['÷', '/']],
    'Calculus & Trig': [['d/dx', 'Differentiate ', 0], ['∫', 'Integrate ', 0], ['∫ a→b', ' from 0 to 1', 0], ['sin', 'sin()', -1], ['cos', 'cos()', -1], ['tan', 'tan()', -1], ['ln', 'ln()', -1], ['log₁₀', 'log()', -1], ['e', 'e']],
    'Templates': [['Quadratic equation', 'Solve ax^2 + bx + c = 0'.replace('ax^2 + bx + c', 'x^2 - 5x + 6'), 0, 1], ['Derivative', 'Differentiate x^3 - 4x^2 + 7x - 2', 0, 1], ['Definite integral', 'Integrate x^2 from 0 to 3', 0, 1], ['Factor', 'Factor 2x^2 + 7x + 3', 0, 1], ['Right triangle', 'A right triangle has legs 3 and 4. Find the hypotenuse.', 0, 1]]
  };
  var engine = null;
  function buildSolve() {
    var hdr = el('div', 'bq-sv-title'); var badge = el('span', 'bq-badge-ic', '∑'); hdr.appendChild(badge); hdr.appendChild(el('b', null, 'Solver')); hdr.appendChild(el('span', 'bq-beta', 'BETA'));
    var h1 = el('h2', 'bq-h1', 'Get the answer step by step');
    var card = el('div', 'bq-inputcard');
    var ta = el('textarea', 'bq-ta'); ta.rows = 4; ta.setAttribute('aria-label', 'Math problem'); ta.placeholder = 'Type a math problem'; ta.spellcheck = false; ta.autocapitalize = 'off';
    var bar = el('div', 'bq-ibar');
    var fxB = btn('bq-fxb', 'fx Math', 'Show or hide the math keypad'); fxB.setAttribute('aria-expanded', 'false');
    var solveB = btn('bq-solveb', '', 'Solve'); var sTxt = el('span', null, 'Solve →'); var spin = el('span', 'bq-spin'); spin.hidden = true; solveB.appendChild(spin); solveB.appendChild(sTxt);
    bar.appendChild(fxB); bar.appendChild(solveB);
    var taWrap = el('div', 'bq-tawrap'); var blink = el('span', 'bq-blink'); blink.setAttribute('aria-hidden', 'true'); taWrap.appendChild(blink); taWrap.appendChild(ta);
    function syncBlink() { blink.hidden = ta.value !== '' || document.activeElement === ta; }
    ta.addEventListener('focus', syncBlink); ta.addEventListener('blur', syncBlink); ta.addEventListener('input', syncBlink); setTimeout(syncBlink, 0);
    card.appendChild(taWrap); card.appendChild(bar);
    var drawer = el('div', 'bq-drawer'); drawer.hidden = true;
    var ktabs = el('div', 'bq-ktabs'); var kgrid = el('div', 'bq-kgrid'); drawer.appendChild(ktabs); drawer.appendChild(kgrid);
    function ins(text, back) { var s = ta.selectionStart, e = ta.selectionEnd, v = ta.value; ta.value = v.slice(0, s) + text + v.slice(e); var c = s + text.length + (back || 0); ta.focus(); ta.setSelectionRange(c, c); grow(); }
    function fillKeys(name) {
      kgrid.innerHTML = ''; Array.prototype.forEach.call(ktabs.children, function (b) { b.classList.toggle('on', b.textContent === name); b.setAttribute('aria-selected', String(b.textContent === name)); });
      KEYS[name].forEach(function (k) { var b = btn('bq-key' + (k[3] ? ' wide' : ''), k[0], null, function () { if (k[3]) { ta.value = k[1]; ta.focus(); grow(); solveNow(); } else { ins(k[1], k[2]); } }); b.setAttribute('aria-label', k[0]); kgrid.appendChild(b); });
    }
    Object.keys(KEYS).forEach(function (n) { var b = btn('bq-ktab', n, null, function () { fillKeys(n); }); b.setAttribute('role', 'tab'); ktabs.appendChild(b); });
    fillKeys('Basic & Algebra');
    function grow() { ta.style.height = 'auto'; ta.style.height = Math.min(200, Math.max(104, ta.scrollHeight)) + 'px'; syncBlink(); }
    ta.addEventListener('input', grow);
    fxB.addEventListener('click', function () { drawer.hidden = !drawer.hidden; fxB.setAttribute('aria-expanded', String(!drawer.hidden)); fxB.classList.toggle('on', !drawer.hidden); });
    ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); solveNow(); } });

    var samplesHead = el('h3', 'bq-h3', 'Try a sample problem.');
    var ctl = el('div', 'bq-sctl'); var shuf = btn('bq-shuf', '⇄', 'Shuffle sample problems'); var sel = el('select', 'bq-sel'); sel.setAttribute('aria-label', 'Sample category');
    GRADES.forEach(function (g) { var o = el('option', null, g[1]); o.value = g[0]; sel.appendChild(o); }); ctl.appendChild(shuf); ctl.appendChild(sel);
    var list = el('div', 'bq-samples');
    function pickSamples(shuffle) {
      var pool = SAMPLES.filter(function (s) { return sel.value === 'all' || s[0] === sel.value; });
      if (shuffle) { pool = pool.slice().sort(function () { return Math.random() - .5; }); }
      list.innerHTML = ''; pool.slice(0, 5).forEach(function (s) { var b = btn('bq-sample', s[2], null, function () { ta.value = s[1]; grow(); solveNow(); }); list.appendChild(b); });
    }
    shuf.addEventListener('click', function () { pickSamples(true); }); sel.addEventListener('change', function () { pickSamples(false); }); pickSamples(false);

    var out = el('div', 'bq-out'); out.hidden = true; out.setAttribute('aria-live', 'polite');
    solvePane.appendChild(hdr); solvePane.appendChild(h1); solvePane.appendChild(card); solvePane.appendChild(drawer); solvePane.appendChild(out); solvePane.appendChild(samplesHead); solvePane.appendChild(ctl); solvePane.appendChild(list);
    solvePane.appendChild(el('div', 'bq-hint', 'Client-Side Solver • Powered by pure JavaScript • log means base 10, ln is natural'));

    function tex(target, t, display) {
      if (window.katex) { try { window.katex.render(t, target, { displayMode: display !== false, throwOnError: false, strict: 'ignore', trust: false, output: 'html' }); return; } catch (e) { /* fall through */ } }
      target.textContent = t.replace(/\\left|\\right|\\quad|\;|\\,/g, ' ').replace(/\\([a-z]+)/g, '$1 ');
    }
    var busy = false;
    function solveNow() {
      if (busy) { return; } var text = ta.value.trim();
      if (!text) { showMsg('Type a problem first.'); return; }
      busy = true; solveB.disabled = true; spin.hidden = false; sTxt.textContent = 'Working…';
      var done = function () { busy = false; solveB.disabled = false; spin.hidden = true; sTxt.textContent = 'Solve →'; };
      loadLibs().then(function () {
        if (!engine) { engine = new window.MathStepEngine(window.nerdamer); }
        var r = engine.solve(text); done(); if (r.ok) { render(r); } else { showMsg(r.message); }
      }).catch(function () { done(); showMsg('The solver modules could not load. Check your internet connection, then tap Solve again.'); });
    }
    solveB.addEventListener('click', solveNow);
    function showMsg(m) { out.hidden = false; out.innerHTML = ''; var d = el('div', 'bq-err', m); d.setAttribute('role', 'alert'); out.appendChild(d); }
    function render(r) {
      out.hidden = false; out.innerHTML = '';
      var ans = el('div', 'bq-ans'); var top = el('div', 'bq-anstop'); top.appendChild(el('span', 'bq-anslabel', 'Final answer'));
      var tg = el('div', 'bq-tg'); var bEx = btn('bq-tgb on', 'Exact', 'Show exact answer'); var bDe = btn('bq-tgb', 'Decimal', 'Show decimal approximation'); tg.appendChild(bEx); tg.appendChild(bDe);
      var cp = btn('bq-cp', 'Copy', 'Copy answer');
      top.appendChild(tg); top.appendChild(cp); var big = el('div', 'bq-bigans'); ans.appendChild(top); ans.appendChild(big); out.appendChild(ans);
      var mode = 'exact';
      function paint() { var cur = mode === 'exact' ? r.answer : r.decimal; tex(big, cur.tex, true); bEx.classList.toggle('on', mode === 'exact'); bDe.classList.toggle('on', mode === 'decimal'); }
      if (!r.decimal) { bDe.disabled = true; bDe.title = 'This answer is already exact and has no separate decimal form'; }
      bEx.addEventListener('click', function () { mode = 'exact'; paint(); }); bDe.addEventListener('click', function () { if (r.decimal) { mode = 'decimal'; paint(); } });
      cp.addEventListener('click', function () {
        var t = (mode === 'exact' ? r.answer : r.decimal).text;
        var ok = function () { cp.textContent = 'Copied'; setTimeout(function () { cp.textContent = 'Copy'; }, 1400); };
        if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(ok, function () { fallbackCopy(t); ok(); }); } else { fallbackCopy(t); ok(); }
      });
      paint();
      var ol = el('ol', 'bq-steps');
      r.steps.forEach(function (s, i) {
        var li = el('li', 'bq-step'); li.appendChild(el('span', 'bq-n', 'Step ' + (i + 1)));
        var bd = el('div', 'bq-sbody'); bd.appendChild(el('div', 'bq-stitle', s.title)); bd.appendChild(el('div', 'bq-stext', s.text));
        s.tex.forEach(function (t) { if (t) { var m = el('div', 'bq-smath'); tex(m, t, true); bd.appendChild(m); } });
        li.appendChild(bd); ol.appendChild(li);
      });
      out.appendChild(ol); out.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
    function fallbackCopy(t) { var a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (e) { /* ignore */ } a.remove(); }
    grow(); setTimeout(function () { loadLibs().catch(function () { /* shown when Solve is pressed */ }); }, 400);
    BQTools._solveText = function (t) { ta.value = t; grow(); solveNow(); };
  }

  /* Phone keyboard: keep the field being typed in visible above the on-screen keyboard. */
  (function () {
    function adj() {
      var vv = window.visualViewport;
      var b = sheet.querySelector('.bq-sh-body'); if (!b) { return; }
      var a = document.activeElement, typing = !!(a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && b.contains(a));
      var kb = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
      if (typing && kb > 80) {
        b.style.paddingBottom = (kb + 28) + 'px';
        try { a.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { /* ignore */ }
      } else { b.style.paddingBottom = ''; }
    }
    sheet.addEventListener('focusin', function () { setTimeout(adj, 120); setTimeout(adj, 450); });
    sheet.addEventListener('focusout', function () { setTimeout(adj, 150); });
    if (window.visualViewport) { window.visualViewport.addEventListener('resize', adj); }
  })();

  var BQTools = window.BQTools = { open: open, close: close, sheet: sheet, pad: pad };
})();
