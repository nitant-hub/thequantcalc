            T('c', 'Constants', 'c  299792458 m/s', [], function() { return '299792458'; });
            T('c', 'Constants', 'R  8.314462618', [], function() { return '8.314462618'; });
            T('c', 'Constants', 'N_A  6.02214076e23', [], function() { return '6.02214076*10^23'; });
            T('c', 'Constants', 'h  Planck', [], function() { return '6.62607015*10^(-34)'; });

            function mk(tag, cls, text) {
                const e = document.createElement(tag);
                if (cls) e.className = cls;
                if (text !== undefined) e.textContent = text;
                return e;
            }
            function tplHasMatrix(t) { return t.params.some(function(p) { return p.type === 'matrix'; }); }

            function defaultExpr(t, size) {
                const v = {};
                t.params.forEach(function(p) {
                    if (p.type === 'matrix') { v[p.k] = matLit((MAT_DEF[size][p.k] || MAT_DEF[size].A), t.eng); }
                    else if (p.type === 'text') { v[p.k] = p.def; }
                    else { v[p.k] = wrapNum(p.def); }
                });
                return t.build(v);
            }

            function readMenuValues() {
                const t = menuState.tpl;
                const vals = {};
                let ok = true;
                t.params.forEach(function(p) {
                    if (p.type === 'matrix') {
                        const n = menuState.size, rows = [];
                        for (let r = 0; r < n; r++) {
                            const row = [];
                            for (let c = 0; c < n; c++) {
                                const inp = menuInputs[p.k + '_' + r + '_' + c];
                                const good = NUM_RE.test(inp.value.trim());
                                inp.classList.toggle('bad', !good);
                                if (!good) { ok = false; }
                                row.push(good ? String(Number(inp.value.trim())) : '0');
                            }
                            rows.push(row);
                        }
                        vals[p.k] = matLit(rows, t.eng);
                    } else if (p.type === 'text') {
                        const s = menuInputs[p.k].value.replace(/\s+/g, '');
                        const good = s.length > 0 && TEXT_RE.test(s);
                        menuInputs[p.k].classList.toggle('bad', !good);
                        if (!good) { ok = false; }
                        vals[p.k] = s;
                    } else {
                        const s = menuInputs[p.k].value.trim();
                        const good = NUM_RE.test(s);
                        menuInputs[p.k].classList.toggle('bad', !good);
                        if (!good) { ok = false; }
                        vals[p.k] = good ? wrapNum(s) : '0';
                    }
                });
                return { ok: ok, vals: vals };
            }

            function commitTemplate(expr) {
                const tail = bcInput ? bcInput.slice(-1) : '';
                if (bcInput && /[+\-*\/^(,\[=;]/.test(tail)) { bcInput += expr; } else { bcInput = expr; }
                api.closeMenu();
                bcUpdate();
                bcLiveOut.innerText = 'Template inserted - press the run key';
            }

            function renderMenuForm() {
                const t = menuState.tpl;
                menuChipsEl.style.display = 'none';
                menuBodyEl.innerHTML = '';
                menuInputs = {};
                const form = mk('div', 'bc-menu-form');
                form.appendChild(mk('div', 'bc-menu-form-title', t.name));

                const hasMat = tplHasMatrix(t);
                if (hasMat) {
                    const sizes = mk('div', 'bc-menu-chips');
                    sizes.style.paddingBottom = '0';
                    [2, 3].forEach(function(n) {
                        const b = mk('button', 'bc-menu-chip' + (menuState.size === n ? ' sel' : ''), n + '×' + n);
                        b.type = 'button';
                        b.addEventListener('click', function() { menuState.size = n; renderMenuForm(); });
                        sizes.appendChild(b);
                    });
                    form.appendChild(sizes);
                }

                const preview = mk('div', 'bc-menu-preview');
                const ins = mk('button', 'bc-menu-btn ins', 'Insert');
                ins.type = 'button';
                function refresh() {
                    const r = readMenuValues();
                    preview.textContent = r.ok ? t.build(r.vals) : 'Check the highlighted fields';
                    ins.disabled = !r.ok;
                }
                function submit() {
                    const r = readMenuValues();
                    if (r.ok) { commitTemplate(t.build(r.vals)); }
                }
                function wire(inp) {
                    inp.type = 'text';
                    inp.setAttribute('autocomplete', 'off');
                    inp.setAttribute('autocapitalize', 'off');
                    inp.setAttribute('spellcheck', 'false');
                    inp.addEventListener('input', refresh);
                    inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
                }

                const fields = mk('div', 'bc-menu-fields');
                const allMat = t.params.length > 0 && t.params.every(function(p) { return p.type === 'matrix'; });
                if (allMat) { fields.style.gridTemplateColumns = 'repeat(' + t.params.length + ', 1fr)'; }
                t.params.forEach(function(p) {
                    if (p.type === 'matrix') {
                        const n = menuState.size;
                        const wrap = mk('div', 'bc-menu-field' + (allMat ? '' : ' bc-menu-matwrap'));
                        wrap.appendChild(mk('span', null, p.label));
                        const grid = mk('div', 'bc-menu-mat');
                        grid.style.gridTemplateColumns = 'repeat(' + n + ', 1fr)';
                        const def = MAT_DEF[n][p.k] || MAT_DEF[n].A;
                        for (let r = 0; r < n; r++) {
                            for (let c = 0; c < n; c++) {
                                const inp = mk('input');
                                inp.value = def[r][c];
                                inp.setAttribute('aria-label', p.label + ' row ' + (r + 1) + ' column ' + (c + 1));
                                wire(inp);
                                menuInputs[p.k + '_' + r + '_' + c] = inp;
                                grid.appendChild(inp);
                            }
                        }
                        wrap.appendChild(grid);
                        fields.appendChild(wrap);
                    } else {
                        const wrap = mk('label', 'bc-menu-field' + (p.type === 'text' ? ' bc-menu-matwrap' : ''));
                        wrap.appendChild(mk('span', null, p.label));
                        const inp = mk('input');
                        inp.value = p.def;
                        wire(inp);
                        menuInputs[p.k] = inp;
                        wrap.appendChild(inp);
                        fields.appendChild(wrap);
                    }
                });
                form.appendChild(fields);
                form.appendChild(preview);

                const actions = mk('div', 'bc-menu-actions');
                const back = mk('button', 'bc-menu-btn back', '← Back');
                back.type = 'button';
                back.addEventListener('click', function() { menuState.view = 'list'; renderMenu(); });
                ins.addEventListener('click', submit);
                actions.appendChild(back);
                actions.appendChild(ins);
                form.appendChild(actions);
                menuBodyEl.appendChild(form);
                refresh();
            }

            function renderMenu() {
                const def = MENU_DEFS[menuState.kind];
                menuTitleEl.textContent = def.title;
                if (menuState.view === 'form') { renderMenuForm(); return; }
                menuChipsEl.innerHTML = '';
                menuBodyEl.innerHTML = '';
                menuChipsEl.style.display = def.cats.length > 1 ? 'flex' : 'none';
                def.cats.forEach(function(cat) {
                    const chip = mk('button', 'bc-menu-chip' + (menuState.cat === cat ? ' sel' : ''), cat);
                    chip.type = 'button';
                    chip.addEventListener('click', function() { menuState.cat = cat; renderMenu(); });
                    menuChipsEl.appendChild(chip);
                });
                if (def.cas) {
                    const sw = mk('button', 'bc-menu-cas' + (primeCasMode ? ' on' : ''),
                        primeCasMode ? 'CAS mode: ON · the PLOT key evaluates (tap to switch off)' : 'CAS mode: OFF · the PLOT key draws graphs (tap to switch on)');
                    sw.type = 'button';
                    sw.addEventListener('click', function() { setPrimeCas(!primeCasMode); renderMenu(); });
                    menuBodyEl.appendChild(sw);
                }
                const list = mk('div', 'bc-menu-list');
                TEMPLATES.filter(function(t) { return t.eng === def.eng && t.cat === menuState.cat; }).forEach(function(t) {
                    const item = mk('button', 'bc-menu-item');
                    item.type = 'button';
                    item.appendChild(mk('b', null, t.name));
                    item.appendChild(mk('span', null, defaultExpr(t, menuState.size)));
                    item.addEventListener('click', function() {
                        if (!t.params.length) { commitTemplate(t.build({})); return; }
                        menuState.tpl = t;
                        menuState.view = 'form';
                        renderMenu();
                    });
                    list.appendChild(item);
                });
                menuBodyEl.appendChild(list);
            }

            function setPrimeCas(on) {
                primeCasMode = !!on;
                const b = document.getElementById('bc-cas-toggle');
                if (b) { b.classList.toggle('bc-cas-on', primeCasMode); }
                if (primeCasMode) { bcLoadAdvancedEngines(); }
                bcLiveOut.innerText = primeCasMode ? 'CAS mode ON - PLOT key evaluates' : 'CAS mode OFF - PLOT key draws graphs';
            }

            const api = {
                setTheme: function(themeClass) {
                    currentTheme = themeClass || '';
                    widgetEl.className = ('blogger-calc-classic ' + currentTheme).trim();
                    try {
                        if (currentTheme) {
                            localStorage.setItem(THEME_STORAGE_KEY, currentTheme);
                        } else {
                            localStorage.removeItem(THEME_STORAGE_KEY);
                        }
                    } catch (e) {}
                },
                openFilters: function() {
                    buildFilters();
                    markSelectedFilter();
                    filterPanel.classList.add('open');
                },
                closeFilters: function() {
                    filterPanel.classList.remove('open');
                },
                pickTheme: function(themeClass) {
                    this.setTheme(themeClass);
                    markSelectedFilter();
                    this.closeFilters();
                },
                copyResult: function() {
                    let rawOut = (bcLiveOut.innerText || '').trim();
                    let textToCopy = '';

                    if (rawOut.startsWith('=')) {
                        textToCopy = rawOut.replace(/^=\s*/, '').trim();
                    } else if (rawOut.includes(' = ') && !/Loading|Syntax|Select/i.test(rawOut)) {
                        textToCopy = rawOut.split(' = ').pop().trim();
                        const numWithNote = textToCopy.match(/^(-?\d+(?:\.\d+)?)\s*\(.*\)$/);
                        if (numWithNote) { textToCopy = numWithNote[1]; }
                    } else {
                        textToCopy = (bcDisp.textContent || '0').trim();
                    }

                    if (!textToCopy) textToCopy = '0';

                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(textToCopy).then(showCopiedConfirmation).catch(function() {
                            fallbackCopyText(textToCopy);
                            showCopiedConfirmation();
                        });
                    } else {
                        fallbackCopyText(textToCopy);
                        showCopiedConfirmation();
                    }
                },
                switchTab: function(tabId, btnElement) {
                    const targetPane = document.getElementById(tabId);
                    const targetBtn = btnElement || document.getElementById('btn-' + tabId);
                    if (!targetPane || !targetBtn) return;

                    if (tabId !== 'bc-history-tab') {
                        bcLastActiveTabId = tabId;
                        try { localStorage.setItem(LAST_CALC_TAB_KEY, bcLastActiveTabId); } catch (e) {}
                    }
                    try { localStorage.setItem(TAB_STORAGE_KEY, tabId); } catch (e) {}

                    document.querySelectorAll('.bc-tab-pane').forEach(el => el.classList.remove('active'));
                    document.querySelectorAll('.bc-tab-btn').forEach(el => el.classList.remove('active'));
                    targetPane.classList.add('active');
                    targetBtn.classList.add('active');

                    if (['bc-cas', 'bc-adv', 'bc-prog', 'bc-graph'].includes(tabId)) {
                        bcLoadAdvancedEngines();
                    }

                    let outBox = document.getElementById('bc-output-box');
                    let canvas = document.getElementById('bc-graph-canvas');
                    if(tabId === 'bc-graph') {
                        outBox.style.height = '140px'; if(canvas) canvas.style.display = 'block';
                    } else {
                        outBox.style.height = '38px'; if(canvas) canvas.style.display = 'none';
                    }
                },
                historyBack: function() {
                    const returnBtn = document.getElementById('btn-' + bcLastActiveTabId);
                    if (returnBtn) { this.switchTab(bcLastActiveTabId, returnBtn); }
                },
                setAngle: function(unit) {
                    isDegree = (unit === 'deg');
                    document.querySelectorAll('.bc-btn-deg').forEach(b => b.classList.toggle('active', unit === 'deg'));
                    document.querySelectorAll('.bc-btn-rad').forEach(b => b.classList.toggle('active', unit === 'rad'));
                    saveCalcState();
                    bcUpdate(); 
                },
                num: function(val) {
                    if (finShiftOn && document.querySelector('.bc-tab-pane.active').id === 'bc-fin') {
                        finSetShift(false);
                        if (!/^[0-9]$/.test(val)) { finShow('f cancelled'); }
                        if (/^[0-9]$/.test(val)) {
                            finDp = Number(val);
                            finShow('Display set to ' + finDp + ' decimal places');
                            const cur = finReadInput();
                            if (cur !== null && finStaleValue !== null) { finPutResult(cur); }
                        }
                        return;
                    }
                    if (finStaleValue !== null) {
                        const wasStale = (bcInput === finStaleValue);
                        finStaleValue = null;
                        if (wasStale && document.querySelector('.bc-tab-pane.active').id === 'bc-fin') { bcInput = ''; bcDisp.textContent = '0'; }
                    }
                    if (bcDisp.textContent === '0' && !val.includes('Math') && !val.includes('bcTrig') && val !== '.' && val !== 'Ans') { bcInput = val; } 
                    else { bcInput += val; }
                    bcUpdate();
                },
                op: function(operator) { bcInput += operator; bcUpdate(); },
                func: function(functionCall) { bcInput += functionCall; bcUpdate(); },
                ans: function() { this.num(lastAnswer.toString()); },
                toggleSign: function() {
                    if(bcInput.startsWith('(-')) bcInput = bcInput.substring(2);
                    else bcInput = '(-' + bcInput; bcUpdate();
                },
                clear: function() { bcInput = ''; bcDisp.textContent = '0'; bcLiveOut.innerText = ''; },
                back: function() {
                    bcInput = bcInput.toString().slice(0, -1);
                    if(bcInput === '') bcDisp.textContent = '0'; else bcUpdate();
                },
                mem: function(action) {
                    let currentVal = 0;
                    try { currentVal = secureEvaluate(bcInput) || 0; } catch(e){}
                    if(action === 'mc') memoryValue = 0;
                    if(action === 'mr') this.num(memoryValue.toString());
                    if(action === 'ms') memoryValue = currentVal;
                    if(action === 'm+') memoryValue += currentVal;
                    if(action === 'm-') memoryValue -= currentVal;
                    bcMemInd.innerText = memoryValue !== 0 ? 'M = ' + memoryValue : '';
                    saveCalcState();
                },
                finComp: function() {
                    isCompMode = !isCompMode;
                    finShow(isCompMode ? 'COMP: tap n, i, PV, PMT or FV to solve' : 'COMP cancelled');
                },
                finKey: function(v) {
                    if (finShiftOn) { finShiftKey(v); return; }
                    if (isCompMode) { finCompute(v); return; }
                    const val = finReadInput();
                    if (val === null) {
                        finShow(FIN_LABELS[v] + ' = ' + finNum(finTvm[v], v === 'i' ? 4 : 2) + ' (stored)');
                        return;
                    }
                    finTvm[v] = val;
                    amortPos = 0;
                    finShow(FIN_LABELS[v] + ' SET TO ' + fmtShort(val));
                    bcInput = ''; bcDisp.textContent = '0';
                },
                finShift: function() { finSetShift(!finShiftOn); finShow(finShiftOn ? 'f: tap a digit (decimals), n AMORT, i INT, PV NPV, PMT RND, FV IRR, CLX clear all' : 'f cancelled'); },
                finFn: function(name) {
                    isCompMode = false;
                    finSetShift(false);
                    if (name !== 'pctt' && name !== 'dpct') { pctPending = null; }
                    if (name === 'amort') { finAmort(); }
                    else if (name === 'price') { finPrice(); }
                    else if (name === 'ytm') { finYtm(); }
                    else if (name === 'pctt' || name === 'dpct') { finPct(name); }
                    else if (name === 'cf0') { finCf0(); }
                    else if (name === 'npv') { finNpv(); }
                    else if (name === 'irr') { finIrr(); }
                    else if (name === 'int') { finInt(); }
                    else { finDepr(name); }
                },
                finEnter: function() {
                    const v = finReadInput();
                    if (v === null) { finShow('Type a cash flow, then ENTER (or tap NPV / IRR)'); return; }
                    cfList.push(v);
                    bcInput = ''; bcDisp.textContent = '0';
                    finShow('CF' + (cfList.length - 1) + ' = ' + fmtShort(v) + ' (CFj count: ' + (cfList.length - 1) + ')');
                },
                finClear: function() {
                    isCompMode = false;
                    if (finShiftOn) {
                        finSetShift(false);
                        finTvm = { n: 0, i: 0, pv: 0, pmt: 0, fv: 0 };
                        cfList = []; cfEntry = false; amortPos = 0; pctPending = null;
                        bcInput = ''; bcDisp.textContent = '0';
                        finShow('All financial registers cleared');
                        return;
                    }
                    pctPending = null;
                    if (cfEntry && !bcInput) {
                        cfEntry = false;
                        finShow('Cash-flow entry closed (' + cfList.length + ' flows kept)');
                        return;
                    }
                    this.clear();
                },
                openMenu: function(kind) {
                    if (!MENU_DEFS[kind]) return;
                    filterPanel.classList.remove('open');
                    menuState = { kind: kind, cat: MENU_DEFS[kind].cats[0], view: 'list', tpl: null, size: 2 };
                    if (MENU_DEFS[kind].cas && !primeCasMode) { setPrimeCas(true); }
                    renderMenu();
                    menuPanel.classList.add('open');
                },
                closeMenu: function() {
                    menuPanel.classList.remove('open');
                    menuState = null;
                },
                exportHistory: function() {
                    const btn = document.getElementById('bc-export-history');
                    const flash = function(text, good) {
                        if (!btn) return;
                        btn.textContent = text;
                        btn.classList.toggle('done', !!good);
                        if (exportResetTimer) { clearTimeout(exportResetTimer); }
                        exportResetTimer = setTimeout(function() {
                            btn.textContent = '⬇ Export .txt';
                            btn.classList.remove('done');
                        }, 1800);
                    };
                    const entries = Array.prototype.slice.call(bcHistList.querySelectorAll('.hist-entry')).reverse();
                    if (!entries.length) { flash('Nothing to export yet', false); return; }
                    const now = new Date();
                    const pad = function(n) { return (n < 10 ? '0' : '') + n; };
                    const stamp = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
                    const lines = [
                        'thequantcals Calculator - History Export',
                        'Exported: ' + now.toLocaleString(),
                        'Angle mode: ' + (isDegree ? 'Degrees' : 'Radians') + ' | Memory: ' + memoryValue + ' | Ans: ' + lastAnswer,
                        'Entries: ' + entries.length + ' (oldest first)',
                        '------------------------------------------------'
                    ];
                    entries.forEach(function(el, idx) {
                        const holder = el.querySelector('.hist-content') || el;
                        const text = (holder.textContent || '').replace(/\s+/g, ' ').trim();
                        const tab = TAB_NAMES[el.getAttribute('data-tab')] || '';
                        lines.push((idx + 1) + '. ' + (tab ? '[' + tab + '] ' : '') + text);
                    });
                    lines.push('');
                    try {
                        const blob = new Blob([lines.join('\r\n')], { type: 'text/plain;charset=utf-8' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'calculator-history-' + stamp + '.txt';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
                        flash('✓ Saved ' + entries.length + ' entries', true);
                    } catch (err) {
                        flash('Export not supported here', false);
                    }
                },
                clearHistory: function() {
                    bcHistList.innerHTML = '<div class="hist-empty">No calculations yet</div>';
                    historyEmpty = true;
                    try { localStorage.removeItem(HISTORY_STORAGE_KEY); } catch (e) {}
                },
                calc: function() {
                    if (pctPending && document.querySelector('.bc-tab-pane.active').id === 'bc-fin') { finPct(pctPending.kind); return; }
                    if (cfEntry && document.querySelector('.bc-tab-pane.active').id === 'bc-fin') { api.finEnter(); return; }
                    if(!bcInput) return;
                    let openParentheses = (bcInput.match(/\(/g) || []).length;
                    let closeParentheses = (bcInput.match(/\)/g) || []).length;
                    while(openParentheses > closeParentheses) { bcInput += ')'; openParentheses--; }

                    let rawExpr = bcInput;
                    let activeTab = document.querySelector('.bc-tab-pane.active').id;
                    let calcInput = bcSmartSyntax(bcInput.replace(/\(\-/g, '(-1*'));
                    
                    try {
                        bcUpdate(); 
                        let oldVisual = bcDisp.textContent; 
                        let result = '';

                        if (activeTab === 'bc-cas' || activeTab === 'bc-adv' || (activeTab === 'bc-graph' && primeCasMode)) {
                            engineNeed('alg');
                            {
                                let algInput = calcInput.replace(/\*\*/g, '^');
                                result = Algebrite.run(algInput);
                                if(result === '' || result.includes('Stop')) throw new Error("Parse Error");
                                if (activeTab === 'bc-graph') {
                                    const plotCanvas = document.getElementById('bc-graph-canvas');
                                    if (plotCanvas) { plotCanvas.getContext('2d').clearRect(0, 0, plotCanvas.width, plotCanvas.height); }
                                }
                            }
                        } 
                        else if (activeTab === 'bc-graph') {
                            engineNeed('math');
                            {
                                let expr = calcInput.replace(/\*\*/g, '^');
                                drawGraph(expr); bcLiveOut.innerText = 'y = ' + expr;
                                if (historyEmpty) { bcHistList.innerHTML = ''; historyEmpty = false; }
                                bcHistList.innerHTML = '<div class="hist-entry" data-expr="' + encodeURIComponent(rawExpr) + '" data-tab="bc-graph" title="Tap to reload graph expression"><span class="hist-content">Plotted: <strong title="Tap to load expression">y = ' + oldVisual + '</strong></span><button type="button" class="hist-del-btn" aria-label="Delete History Entry" title="Delete this entry">×</button></div>' + bcHistList.innerHTML;
                                saveHistoryToStorage();
                                return; 
                            }
                        }
                        else if (activeTab === 'bc-prog') {
                            engineNeed('math');
                            {
                                let mRes = math.evaluate(calcInput.replace(/\*\*/g, '^'));
                                if (mRes && Array.isArray(mRes.entries)) { mRes = mRes.entries[mRes.entries.length - 1]; }
                                result = (typeof mRes === 'number') ? mRes : math.format(mRes, { precision: 14 });
                            }
                        }
                        else {
                            result = secureEvaluate(calcInput);
                            if(!isFinite(result) || isNaN(result)) throw new Error("Math Error");
                            result = Math.round(result * 1e12) / 1e12; 
                        }
                        
                        lastAnswer = result; 
                        saveCalcState();
                        let cleanResStr = cleanBloggerEntities(result.toString());
                        if (historyEmpty) { bcHistList.innerHTML = ''; historyEmpty = false; }
                        bcHistList.innerHTML = '<div class="hist-entry" data-expr="' + encodeURIComponent(rawExpr) + '" data-res="' + encodeURIComponent(cleanResStr) + '" data-tab="' + activeTab + '" title="Tap row to load expression, or tap result to load answer"><span class="hist-content">' + oldVisual + ' = <strong title="Tap to load result">' + cleanResStr + '</strong></span><button type="button" class="hist-del-btn" aria-label="Delete History Entry" title="Delete this entry">×</button></div>' + bcHistList.innerHTML;
                        saveHistoryToStorage();
                        
                        bcInput = result.toString();
                        bcUpdate(); 
                        bcLiveOut.innerText = '= ' + cleanResStr;
                    } catch (e) {
                        bcLiveOut.innerText = (e.message === "Loading") ? "Wait: Loading Engines..." : (e.message === "Retrying") ? "Engine download retrying - wait, then tap = again" : "Syntax Error";
                    }
                }
            };

            /* Clipboard Paste (Ctrl+V / Cmd+V / Browser Paste) Support for Expressions */
            document.addEventListener('paste', function(e) {
                const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : '';
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable)) {
                    return;
                }
                if (filterPanel && filterPanel.classList.contains('open')) return;
                if (menuPanel && menuPanel.classList.contains('open')) return;

                const clipboardData = e.clipboardData || window.clipboardData;
                if (!clipboardData) return;
                const pastedText = clipboardData.getData('text');
                if (!pastedText) return;

                const activePane = document.querySelector('.bc-tab-pane.active');
                let activeTabId = activePane ? activePane.id : 'bc-basic';
                if (activeTabId === 'bc-history-tab') {
                    api.historyBack();
                    const updatedPane = document.querySelector('.bc-tab-pane.active');
                    activeTabId = updatedPane ? updatedPane.id : bcLastActiveTabId;
                }

                const cleaned = sanitizePastedExpression(pastedText, activeTabId);
                if (!cleaned) return;

                e.preventDefault();
                if (bcDisp.textContent === '0' || !bcInput) {
                    bcInput = cleaned;
                } else {
                    bcInput += cleaned;
                }
                bcUpdate();
            });

            /* Physical Keyboard Event Listener for Desktop Users */
            document.addEventListener('keydown', function(e) {
                /* Ignore if typing inside an external form input */
                const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : '';
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable)) {
                    return;
                }

                /* Support Ctrl+C / Cmd+C to copy calculator output when no page text is selected */
                if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 'c' || e.key === 'C')) {
                    const sel = window.getSelection ? window.getSelection().toString() : '';
                    if (!sel) {
                        e.preventDefault();
                        api.copyResult();
                    }
                    return;
                }

                if (e.ctrlKey || e.altKey || e.metaKey) return;

                const key = e.key;

                /* Handle Escape: close filter panel if open, otherwise clear display */
                if (key === 'Escape') {
                    e.preventDefault();
                    if (menuPanel && menuPanel.classList.contains('open')) {
                        api.closeMenu();
                    } else if (filterPanel && filterPanel.classList.contains('open')) {
                        api.closeFilters();
                    } else {
                        api.clear();
                    }
                    return;
                }

                /* Ignore calculator keys while the filter selection modal is open */
                if (filterPanel && filterPanel.classList.contains('open')) return;
                if (menuPanel && menuPanel.classList.contains('open')) return;

                /* If user starts typing while viewing History, return to last active calculator tab */
                const activePane = document.querySelector('.bc-tab-pane.active');
                const activeTabId = activePane ? activePane.id : 'bc-basic';
                const ensureCalculatorTab = function() {
                    if (activeTabId === 'bc-history-tab') {
                        api.historyBack();
                    }
                };

                if (/^[0-9]$/.test(key) || key === '.') {
                    e.preventDefault();
                    ensureCalculatorTab();
                    api.num(key);
                } else if (key === '+' || key === '-' || key === '*' || key === '/' || key === '%') {
                    e.preventDefault();
                    ensureCalculatorTab();
                    api.op(key);
                } else if (key === '^') {
                    e.preventDefault();
                    ensureCalculatorTab();
                    api.op('**');
                } else if (key === '(' || key === ')' || key === ',' || key === '[' || key === ']') {
                    e.preventDefault();
                    ensureCalculatorTab();
                    api.num(key);
                } else if (key === ';') {
                    e.preventDefault();
                    ensureCalculatorTab();
                    api.op(';');
                } else if (key === '!') {
                    e.preventDefault();
                    ensureCalculatorTab();
                    api.func('bcFact');
                } else if (key === 'Enter' || key === '=') {
                    e.preventDefault();
                    ensureCalculatorTab();
                    api.calc();
                } else if (key === 'Backspace') {
                    e.preventDefault();
                    ensureCalculatorTab();
                    api.back();
                } else if (key === 'Delete') {
                    e.preventDefault();
                    ensureCalculatorTab();
                    api.clear();
                } else if (/^[xyztXYZT]$/.test(key)) {
                    e.preventDefault();
                    ensureCalculatorTab();
                    api.num(key.toLowerCase());
                } else if (key === 'i' || key === 'I') {
                    e.preventDefault();
                    ensureCalculatorTab();
                    api.num('i');
                } else if (key === 'e' || key === 'E') {
                    e.preventDefault();
                    ensureCalculatorTab();
                    const tabNow = document.querySelector('.bc-tab-pane.active').id;
                    api.num((tabNow === 'bc-graph' || tabNow === 'bc-cas') ? 'e' : 'Math.E');
                } else if (key === 'p' || key === 'P') {
                    e.preventDefault();
                    ensureCalculatorTab();
                    const tabNow = document.querySelector('.bc-tab-pane.active').id;
                    api.num((tabNow === 'bc-graph' || tabNow === 'bc-cas') ? 'pi' : 'Math.PI');
                }
            });

            /* Restore saved theme filter, history log, and active tab on page load */
            try {
                const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
                if (savedTheme && FILTERS.some(function(f) { return f[0] === savedTheme; })) {
                    api.setTheme(savedTheme);
                }

                const savedHistory = localStorage.getItem(HISTORY_STORAGE_KEY);
                if (savedHistory && savedHistory.trim() !== '') {
                    bcHistList.innerHTML = savedHistory;
                    upgradeSavedHistoryEntries();
                    historyEmpty = (bcHistList.querySelectorAll('.hist-entry').length === 0);
                }

                const savedLastCalcTab = localStorage.getItem(LAST_CALC_TAB_KEY);
                if (savedLastCalcTab && document.getElementById(savedLastCalcTab)) {
                    bcLastActiveTabId = savedLastCalcTab;
                }

                const savedTab = localStorage.getItem(TAB_STORAGE_KEY);
                if (savedTab && document.getElementById(savedTab)) {
                    const tabBtn = document.getElementById('btn-' + savedTab);
                    if (tabBtn) {
                        api.switchTab(savedTab, tabBtn);
                    }
                }
            } catch (e) {}

            /* Restore saved angle mode, memory and Ans (read everything first, then apply) */
            try {
                const savedAngle = localStorage.getItem(ANGLE_STORAGE_KEY);
                const savedMem = localStorage.getItem(MEMORY_STORAGE_KEY);
                const savedAns = localStorage.getItem(ANS_STORAGE_KEY);
                if (savedMem !== null && savedMem !== '' && isFinite(Number(savedMem))) {
                    memoryValue = Number(savedMem);
                    bcMemInd.innerText = memoryValue !== 0 ? 'M = ' + memoryValue : '';
                }
                if (savedAns !== null && savedAns !== '') {
                    lastAnswer = (savedAns.trim() !== '' && isFinite(Number(savedAns))) ? Number(savedAns) : savedAns;
                }
                if (savedAngle === 'rad' || savedAngle === 'deg') { api.setAngle(savedAngle); }
            } catch (e) {}

            menuPanel.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') { e.stopPropagation(); api.closeMenu(); }
            });

            return api;
        })();
    </script>
</div>

</body>
