<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculator Widget</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: Arial, Helvetica, sans-serif;
            box-sizing: border-box;
            overflow: hidden;
            touch-action: manipulation;
        }
    </style>
</head>
<body>

<div class="blogger-calc-classic" id="blogger-calc-widget">
    <style>
        /* CLEAN HIGH-READABILITY SHELL */
        .blogger-calc-classic {
            width: 100%;
            max-width: 630px; 
            margin: 0 auto !important; 
            box-sizing: border-box;
            background: #eef3f8;
            border: 1px solid #9fb4cb;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            padding: 8px; 
            position: relative;
        }

        .blogger-calc-classic *, .blogger-calc-classic *::before, .blogger-calc-classic *::after { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }

        /* TABS */
        .bc-tabs {
            display: flex; 
            margin-bottom: 6px; 
            border-bottom: 2px solid #3b5998;
            overflow-x: auto; 
            scrollbar-width: none; 
            white-space: nowrap;
            gap: 2px;
            padding-bottom: 0;
        }
        .bc-tabs::-webkit-scrollbar { display: none; } 

        .bc-tab-btn {
            padding: 5px 12px; 
            background: #dbe4ef; 
            border: 1px solid #a3b8ce; 
            border-bottom: none; 
            border-radius: 4px 4px 0 0;
            font-size: 12px; 
            font-weight: 900; 
            color: #000000; 
            cursor: pointer;
            transition: all 0.1s ease; 
            flex-shrink: 0;
        }
        .bc-tab-btn:hover { color: #000; background: #ffffff; }
        .bc-tab-btn.active {
            background: #3b5998; 
            color: #ffffff !important; 
            border-color: #3b5998;
            margin-bottom: -1px;
        }

        #btn-bc-history-tab {
            background: #1e293b;
            color: #ffffff !important;
            border-color: #0f172a;
            position: sticky;
            right: 0;
            z-index: 10;
            text-transform: uppercase;
        }
        #btn-bc-history-tab.active {
            background: #3b5998;
        }

        /* SCREEN */
        .bc-screen-container {
            border: 1px solid #7c93ab;
            border-radius: 3px; 
            margin-bottom: 6px; 
            display: flex; 
            flex-direction: column;
            overflow: hidden; 
            background: #ffffff;
        }

        .bc-input-box {
            background: #ffffff; 
            color: #000000 !important; 
            border: none;
            width: 100%; 
            padding: 4px 8px 0; 
            font-size: 16px !important; 
            font-weight: 900; 
            text-align: right; 
            outline: none; 
            font-family: inherit; 
            height: 22px; 
            line-height: 22px;
            white-space: nowrap; 
            overflow-x: auto;
            user-select: none;
        }

        .bc-output-box {
            background: #3b5998; 
            color: #ffffff !important; 
            padding: 2px 8px;
            font-size: 28px !important; 
            text-align: right; 
            font-weight: 900 !important; 
            height: 38px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            font-family: inherit; 
            white-space: nowrap; 
            overflow-x: auto; 
            overflow-y: hidden;
            position: relative;
        }
        
        .bc-mem-indicator { font-size: 12px; font-weight: 900; color: #dceefb; z-index: 10; }
        #bc-live-out { z-index: 10; font-weight: 900; }

        .bc-input-box::-webkit-scrollbar, .bc-output-box::-webkit-scrollbar { height: 3px; }
        .bc-input-box::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
        .bc-output-box::-webkit-scrollbar-thumb { background: #93c5fd; border-radius: 2px; }

        /* KEYPAD WORKSPACE */
        .bc-keypad-container {
            height: 255px;
            min-height: 255px;
            max-height: 255px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .bc-tab-pane { 
            display: none !important; 
            gap: 4px; 
            height: 100%;
            width: 100%;
        }
        .bc-tab-pane.active { display: grid !important; }
        #bc-history-tab.active { display: flex !important; }

        .bc-grid-basic { grid-template-columns: repeat(4, 1fr); max-width: 350px; margin: 0 auto; }
        .bc-grid-sci-desktop { grid-template-columns: repeat(10, 1fr); }
        .bc-grid-gate { grid-template-columns: repeat(11, 1fr); }
        .bc-grid-adv { grid-template-columns: repeat(10, 1fr); }
        .bc-grid-prog { grid-template-columns: repeat(9, 1fr); }
        .bc-grid-graph { grid-template-columns: repeat(9, 1fr); }
        .bc-grid-cas { grid-template-columns: repeat(10, 1fr); }
        .bc-grid-fin { grid-template-columns: repeat(8, 1fr); }

        /* BUTTONS ENGINE */
        .bc-btn {
            font-family: inherit; 
            border: 1px solid #94a8be; 
            border-radius: 3px; 
            height: 38px; 
            font-size: 15px !important; 
            font-weight: 900 !important; 
            letter-spacing: -0.2px;
            cursor: pointer; 
            display: flex;
            align-items: center; 
            justify-content: center; 
            user-select: none;
            background: #ffffff; 
            color: #000000 !important; 
            padding: 0 1px;
            transition: all 0.08s ease;
        }
        .bc-btn:hover { background: #f0f4f8; }
        .bc-btn:active { transform: translateY(1px); }

        /* 1. NUMBERS BLOCK */
        .bc-btn-num { 
            background: #c6d9ec !important; 
            color: #000000 !important; 
            font-size: 20px !important; 
            font-weight: 900 !important;
            border-color: #92b0d0 !important;
        }
        .bc-btn-num:hover { background: #b4cee6 !important; }

        /* 2. OPERATORS */
        .bc-btn-op,
        .bc-btn[aria-label="Add"],
        .bc-btn[aria-label="Subtract"],
        .bc-btn[aria-label="Multiply"],
        .bc-btn[aria-label="Divide"],
        .bc-btn[aria-label="Modulo"],
        .bc-btn[aria-label="Modulo or Percent"],
        .bc-btn[aria-label="Percent"] {
            font-size: 19px !important;
            font-weight: 900 !important;
            background: #e1ebf5 !important;
            border-color: #a3bacc !important;
            color: #000000 !important;
        }
        .bc-btn-op:hover { background: #d0e0ee !important; }

        /* 3. EQUALS BUTTON (=) */
        .bc-btn-primary,
        .bc-btn[aria-label="Calculate Equals"] { 
            background: #2563eb !important; 
            color: #ffffff !important; 
            border-color: #1d4ed8 !important; 
            font-size: 22px !important; 
            font-weight: 900 !important;
        }
        .bc-btn-primary:hover { background: #1d4ed8 !important; }

        /* 4. CLEAR / AC / C BUTTON */
        .bc-btn-danger,
        .bc-btn[aria-label="Clear All"] { 
            background: #dc2626 !important; 
            color: #ffffff !important; 
            border-color: #b91c1c !important; 
            font-size: 15px !important; 
            font-weight: 900 !important;
        }
        .bc-btn-danger:hover { background: #b91c1c !important; }

        /* 5. BACKSPACE / DELETE BUTTON */
        .bc-btn-delete,
        .bc-btn[aria-label="Backspace"] {
            background: #ea580c !important;
            color: #ffffff !important;
            border-color: #c2410c !important;
            font-size: 15px !important;
            font-weight: 900 !important;
        }
        .bc-btn-delete:hover { background: #c2410c !important; }

        /* 6. DEG / RAD TOGGLE BUTTONS */
        .bc-btn-deg, .bc-btn-rad {
            font-size: 13px !important;
            font-weight: 900 !important;
            background: #dbe4ef;
            color: #000000 !important;
            border-color: #94a8be;
        }
        .bc-btn-deg.active, .bc-btn-rad.active {
            background: #1e3a8a !important;
            color: #ffffff !important;
            border-color: #172554 !important;
        }

        .bc-btn-action { 
            background: #e1ebf5; 
            color: #000000 !important; 
            font-size: 13px !important;
            font-weight: 900 !important;
            border-color: #a3bacc;
        }

        .bc-btn-special { 
            background: #fff8e1; 
            color: #000000 !important; 
            border-color: #ffe082;
            font-size: 11px;
            font-weight: 900 !important;
        }

        .bc-span-2 { grid-column: span 2; }
        .bc-span-3 { grid-column: span 3; }
        .bc-span-5 { grid-column: span 5; }
        .bc-span-6 { grid-column: span 6; }
        .bc-span-9 { grid-column: span 9; }
        .bc-span-10 { grid-column: span 10; }

        /* HISTORY */
        #bc-history-tab { 
            background: #ffffff; 
            border: 1px solid #9fb4cb; 
            border-radius: 4px; 
            padding: 8px; 
            flex-direction: column; 
            height: 100% !important;
            box-sizing: border-box;
        }
        .bc-history-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #d0dce7; padding-bottom: 4px; margin-bottom: 6px; flex-shrink: 0; }
        .bc-history-title { font-weight: 900; color: #3b5998; font-size: 13px; text-transform: uppercase; }
        .bc-history-back-btn, .bc-clear-history { font-size: 11px; font-weight: 900; cursor: pointer; padding: 3px 8px; border-radius: 3px; border: 1px solid transparent; text-transform: uppercase; }
        .bc-history-back-btn { background: #3b5998; color: #ffffff; }
        .bc-clear-history { background: #dc2626; color: #ffffff; }
        .bc-history-list { flex-grow: 1; overflow-y: auto; font-family: inherit; font-size: 14px; }
        .hist-entry { margin-bottom: 4px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 3px; text-align: left; color: #000000; font-weight: 900; }
        .hist-entry strong { color: #3b5998; font-weight: 900 !important; }
        .hist-empty { color: #64748b; text-align: center; font-style: italic; padding-top: 40px; }

        /* MOBILE VIEW */
        @media (max-width: 600px) {
            .blogger-calc-classic { padding: 5px; } 
            .bc-keypad-container { height: 235px; min-height: 235px; max-height: 235px; }
            .bc-btn { height: 34px !important; font-size: 11px !important; font-weight: 900 !important; }
            .bc-btn-num { font-size: 17px !important; font-weight: 900 !important; }
            .bc-btn-op { font-size: 16px !important; font-weight: 900 !important; }
            .bc-btn-primary { font-size: 18px !important; font-weight: 900 !important; }
            .bc-tab-pane { gap: 2px !important; }
        }
    </style>

    <div class="bc-tabs" role="tablist">
        <button class="bc-tab-btn active" role="tab" id="btn-bc-basic" onclick="BloggerCalc.switchTab('bc-basic', this)">Basic</button>
        <button class="bc-tab-btn" role="tab" id="btn-bc-sci-desktop" onclick="BloggerCalc.switchTab('bc-sci-desktop', this)">Scientific</button>
        <button class="bc-tab-btn" role="tab" id="btn-bc-gate" onclick="BloggerCalc.switchTab('bc-gate', this)">GATE</button>
        <button class="bc-tab-btn" role="tab" id="btn-bc-adv" onclick="BloggerCalc.switchTab('bc-adv', this)">FX-991CW</button>
        <button class="bc-tab-btn" role="tab" id="btn-bc-prog" onclick="BloggerCalc.switchTab('bc-prog', this)">FX-5800P</button>
        <button class="bc-tab-btn" role="tab" id="btn-bc-graph" onclick="BloggerCalc.switchTab('bc-graph', this)">HP Prime</button>
        <button class="bc-tab-btn" role="tab" id="btn-bc-cas" onclick="BloggerCalc.switchTab('bc-cas', this)">TI-Nspire</button>
        <button class="bc-tab-btn" role="tab" id="btn-bc-fin" onclick="BloggerCalc.switchTab('bc-fin', this)">HP 12C</button>
        <button class="bc-tab-btn" role="tab" id="btn-bc-history-tab" onclick="BloggerCalc.switchTab('bc-history-tab', this)">HISTORY</button>
    </div>

    <div class="bc-screen-container">
        <div class="bc-input-box" id="bc-display" aria-label="Calculator Expression Display">0</div>
        <div class="bc-output-box" id="bc-output-box" aria-live="polite" aria-atomic="true">
            <span class="bc-mem-indicator" id="bc-memory-indicator"></span>
            <span id="bc-live-out"></span>
        </div>
    </div>

    <div class="bc-keypad-container">
        <!-- 1. BASIC -->
        <div class="bc-tab-pane bc-grid-basic active" role="tabpanel" id="bc-basic">
            <button class="bc-btn bc-btn-danger" aria-label="Clear All" onclick="BloggerCalc.clear()">AC</button>
            <button class="bc-btn bc-btn-delete" aria-label="Backspace" onclick="BloggerCalc.back()">Back</button>
            <button class="bc-btn bc-btn-op" aria-label="Modulo or Percent" onclick="BloggerCalc.op('%')">%</button>
            <button class="bc-btn bc-btn-op" aria-label="Divide" onclick="BloggerCalc.op('/')">/</button>
            <button class="bc-btn bc-btn-num" onclick="BloggerCalc.num('7')">7</button>
            <button class="bc-btn bc-btn-num" onclick="BloggerCalc.num('8')">8</button>
            <button class="bc-btn bc-btn-num" onclick="BloggerCalc.num('9')">9</button>
            <button class="bc-btn bc-btn-op" aria-label="Multiply" onclick="BloggerCalc.op('*')">*</button>
            <button class="bc-btn bc-btn-num" onclick="BloggerCalc.num('4')">4</button>
            <button class="bc-btn bc-btn-num" onclick="BloggerCalc.num('5')">5</button>
            <button class="bc-btn bc-btn-num" onclick="BloggerCalc.num('6')">6</button>
            <button class="bc-btn bc-btn-op" aria-label="Subtract" onclick="BloggerCalc.op('-')">-</button>
            <button class="bc-btn bc-btn-num" onclick="BloggerCalc.num('1')">1</button>
            <button class="bc-btn bc-btn-num" onclick="BloggerCalc.num('2')">2</button>
            <button class="bc-btn bc-btn-num" onclick="BloggerCalc.num('3')">3</button>
            <button class="bc-btn bc-btn-op" aria-label="Add" onclick="BloggerCalc.op('+')">+</button>
            <button class="bc-btn bc-btn-num bc-span-2" onclick="BloggerCalc.num('0')">0</button>
            <button class="bc-btn bc-btn-num" aria-label="Decimal" onclick="BloggerCalc.num('.')">.</button>
            <button class="bc-btn bc-btn-primary" aria-label="Calculate Equals" onclick="BloggerCalc.calc()">=</button>
        </div>

        <!-- 2. SCIENTIFIC -->
        <div class="bc-tab-pane bc-grid-sci-desktop" role="tabpanel" id="bc-sci-desktop">
            <button class="bc-btn" onclick="BloggerCalc.func('bcTrig.sin')">sin</button>
            <button class="bc-btn" onclick="BloggerCalc.func('bcTrig.cos')">cos</button>
            <button class="bc-btn" onclick="BloggerCalc.func('bcTrig.tan')">tan</button>
            <button class="bc-btn bc-btn-deg active" data-unit="deg" onclick="BloggerCalc.setAngle('deg')">Deg</button>
            <button class="bc-btn bc-btn-rad" data-unit="rad" onclick="BloggerCalc.setAngle('rad')">Rad</button>
            <button class="bc-btn bc-btn-num" onclick="BloggerCalc.num('7')">7</button>
            <button class="bc-btn bc-btn-num" onclick="BloggerCalc.num('8')">8</button>
            <button class="bc-btn bc-btn-num" onclick="BloggerCalc.num('9')">9</button>
            <button class="bc-btn bc-btn-op" aria-label="Add" onclick="BloggerCalc.op('+')">+</button>
            <button class="bc-btn bc-btn-delete" aria-label="Backspace" onclick="BloggerCalc.back()">Back</button>

            <button class="bc-btn" onclick="BloggerCalc.func('bcTrig.asin')">sin⁻¹</button>
            <button class="bc-btn" onclick="BloggerCalc.func('bcTrig.acos')">cos⁻¹</button>
            <button class="bc-btn" onclick="BloggerCalc.func('bcTrig.atan')">tan⁻¹</button>
            <button class="bc-btn" onclick="BloggerCalc.num('Math.PI')">π</button>
            <button class="bc-btn" onclick="BloggerCalc.num('Math.E')">e</button>
            <button class="bc-btn bc-btn-num" onclick="BloggerCalc.num('4')">4</button>
            <button class="bc-btn bc-btn-num" onclick="BloggerCalc.num('5')">5</button>
            <button class="bc-btn bc-btn-num" onclick="BloggerCalc.num('6')">6</button>
            <button class="bc-btn bc-btn-op" aria-label="Subtract" onclick="BloggerCalc.op('-')">-</button>
            <button class="bc-btn bc-btn-action" onclick="BloggerCalc.ans()">Ans</button>

            <button class="bc-btn" onclick="BloggerCalc.op('**')">xʸ</button>
            <button class="bc-btn" onclick="BloggerCalc.op('**3')">x³</button>
            <button class="bc-btn" onclick="BloggerCalc.op('**2')">x²</button>
            <button class="bc-btn" onclick="BloggerCalc.func('Math.exp')">eˣ</button>
            <button class="bc-btn" onclick="BloggerCalc.op('*10**')">10ˣ</button>
            <button class="bc-btn bc-btn-num" onclick="BloggerCalc.num('1')">1</button>
            <button class="bc-btn bc-btn-num" onclick="BloggerCalc.num('2')">2</button>
            <button class="bc-btn bc-btn-num" onclick="BloggerCalc.num('3')">3</button>
            <button class="bc-btn bc-btn-op" aria-label="Multiply" onclick="BloggerCalc.op('*')">*</button>
            <button class="bc-btn bc-btn-action" onclick="BloggerCalc.mem('m+')">M+</button>

            <button class="bc-btn" onclick="BloggerCalc.func('bcNthRoot')">ʸ√x</button>
            <button class="bc-btn" onclick="BloggerCalc.func('Math.cbrt')">∛</button>
            <button class="bc-btn" onclick="BloggerCalc.func('Math.sqrt')">√</button>
            <button class="bc-btn" onclick="BloggerCalc.func('Math.log')">ln</button>
            <button class="bc-btn" onclick="BloggerCalc.func('Math.log10')">log</button>
            <button class="bc-btn bc-btn-num" onclick="BloggerCalc.num('0')">0</button>
            <button class="bc-btn bc-btn-num" aria-label="Decimal" onclick="BloggerCalc.num('.')">.</button>
            <button class="bc-btn bc-btn-action" onclick="BloggerCalc.op('*10**')">EXP</button>
            <button class="bc-btn bc-btn-op" aria-label="Divide" onclick="BloggerCalc.op('/')">/</button>
            <button class="bc-btn bc-btn-action" onclick="BloggerCalc.mem('m-')">M-</button>

            <button class="bc-btn" onclick="BloggerCalc.num('(')">(</button>
            <button class="bc-btn" onclick="BloggerCalc.num(')')">)</button>
            <button class="bc-btn" onclick="BloggerCalc.func('1/')">1/x</button>
            <button class="bc-btn bc-btn-op" aria-label="Percent" onclick="BloggerCalc.op('%')">%</button>
            <button class="bc-btn" onclick="BloggerCalc.func('bcFact')">n!</button>
            <button class="bc-btn" onclick="BloggerCalc.toggleSign()">±</button>
            <button class="bc-btn" onclick="BloggerCalc.num('Math.random()')">RND</button>
            <button class="bc-btn bc-btn-danger" onclick="BloggerCalc.clear()">AC</button>
            <button class="bc-btn bc-btn-primary" onclick="BloggerCalc.calc()">=</button>
            <button class="bc-btn bc-btn-action" onclick="BloggerCalc.mem('mr')">MR</button>
        </div>

        <!-- 3. GATE -->
        <div class="bc-tab-pane bc-grid-gate" role="tabpanel" id="bc-gate">
            <button class="bc-btn" onclick="BloggerCalc.op('%')">mod</button>
            <button class="bc-btn bc-btn-deg active" data-unit="deg" onclick="BloggerCalc.setAngle('deg')">Deg</button>
            <button class="bc-btn bc-btn-rad" data-unit="rad" onclick="BloggerCalc.setAngle('rad')">Rad</button>
            <button class="bc-btn" onclick="BloggerCalc.func('Math.sinh')">sinh</button>
            <button class="bc-btn" onclick="BloggerCalc.func('Math.cosh')">cosh</button>
            <button class="bc-btn" onclick="BloggerCalc.func('Math.tanh')">tanh</button>
            <button class="bc-btn bc-btn-action" onclick="BloggerCalc.mem('mc')">MC</button>
            <button class="bc-btn bc-btn-action" onclick="BloggerCalc.mem('mr')">MR</button>
            <button class="bc-btn bc-btn-action" onclick="BloggerCalc.mem('ms')">MS</button>
            <button class="bc-btn bc-btn-action" onclick="BloggerCalc.mem('m+')">M+</button>
            <button class="bc-btn bc-btn-action" onclick="BloggerCalc.mem('m-')">M-</button>

            <button class="bc-btn" onclick="BloggerCalc.op('*10**')">Exp</button>
            <button class="bc-btn" onclick="BloggerCalc.func('Math.sqrt')">√</button>
            <button class="bc-btn" onclick="BloggerCalc.func('Math.log2')">log₂</button>
            <button class="bc-btn" onclick="BloggerCalc.func('Math.asinh')">sinh⁻¹</button>
            <button class="bc-btn" onclick="BloggerCalc.func('Math.acosh')">cosh⁻¹</button>
            <button class="bc-btn" onclick="BloggerCalc.func('Math.atanh')">tanh⁻¹</button>
            <button class="bc-btn bc-btn-action" onclick="BloggerCalc.num('(')">(</button>
            <button class="bc-btn bc-btn-action" onclick="BloggerCalc.num(')')">)</button>
            <button class="bc-btn bc-btn-delete" onclick="BloggerCalc.back()">←</button>
            <button class="bc-btn bc-btn-danger" onclick="BloggerCalc.clear()">C</button>
            <button class="bc-btn bc-btn-action" onclick="BloggerCalc.toggleSign()">±</button>

            <button class="bc-btn" onclick="BloggerCalc.func('Math.log')">ln</button>
            <button class="bc-btn" onclick="BloggerCalc.num('Math.PI')">π</button>
            <button class="bc-btn" onclick="BloggerCalc.num('Math.E')">e</button>
            <button class="bc-btn" onclick="BloggerCalc.func('bcFact')">n!</button>
            <button class="bc-btn" onclick="BloggerCalc.func('bcLogY')">logᵧx</button>
            <button class="bc-btn" onclick="BloggerCalc.func('Math.log10')">log</button>
            <button class="bc-btn bc-btn-num" onclick="BloggerCalc.num('7')">7</button>
            <button class="bc-btn bc-btn-num" onclick="BloggerCalc.num('8')">8</button>
            <button class="bc-btn bc-btn-num" onclick="BloggerCalc.num('9')">9</button>
            <button class="bc-btn bc-btn-op" aria-label="Divide" onclick="BloggerCalc.op('/')">/</button>
            <button class="bc-btn bc-btn-op" aria-label="Modulo" onclick="BloggerCalc.op('%')">%</button>

            <button class="bc-btn" onclick="BloggerCalc.func('Math.exp')">eˣ</button>
            <button class="bc-btn" onclick="BloggerCalc.func('bcTrig.sin')">sin</button>
            <button class="bc-btn" onclick="BloggerCalc.func('bcTrig.cos')">cos</button>
            <button class="bc-btn" onclick="BloggerCalc.func('bcTrig.tan')">tan</button>
            <button class="bc-btn" onclick="BloggerCalc.op('**')">xʸ</button>
            <button class="bc-btn" onclick="BloggerCalc.op('10**')">10ˣ</button>
            <button class="bc-btn bc-btn-num" onclick="BloggerCalc.num('4')">4</button>
            <button class="bc-btn bc-btn-num" onclick="BloggerCalc.num('5')">5</button>

    <script>
        const BloggerCalc = (function() {
            const bcDisp = document.getElementById('bc-display');
            const bcLiveOut = document.getElementById('bc-live-out');
            const bcMemInd = document.getElementById('bc-memory-indicator');
            const bcHistList = document.getElementById('bc-history-list');
            
            let bcInput = '';
            let isDegree = true;
            let memoryValue = 0;
            let lastAnswer = 0; 
            let historyEmpty = true;
            let bcLastActiveTabId = 'bc-basic';

            let finTvm = { n: 0, i: 0, pv: 0, pmt: 0, fv: 0 };
            let isCompMode = false;

            let extEnginesLoaded = false;
            function bcLoadAdvancedEngines() {
                if (extEnginesLoaded) return;
                bcLiveOut.innerText = "Loading Modules...";
                
                let s1 = document.createElement('script');
                s1.src = "https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js";
                let s2 = document.createElement('script');
                s2.src = "https://unpkg.com/algebrite@1.4.0/dist/algebrite.bundle-for-browser.js";
                
                s2.onload = () => {
                    extEnginesLoaded = true;
                    bcLiveOut.innerText = "Modules Ready";
                    setTimeout(() => { if(bcLiveOut.innerText === "Modules Ready") bcLiveOut.innerText = ""; }, 1500);
                };
                document.head.appendChild(s1);
                document.head.appendChild(s2);
            }

            function cleanBloggerEntities(str) {
                let txt = document.createElement("textarea"); txt.innerHTML = str; return txt.value;
            }

            function secureEvaluate(expr) {
                const testStr = expr.replace(/(Math\.[a-zA-Z0-9]+|bcTrig\.[a-zA-Z]+|bc[A-zA-Z]+)/g, '')
                                    .replace(/[0-9+\-*/().,% eE]/g, '');
                if (testStr.length > 0) {
                    throw new Error("Security Error: Invalid input detected");
                }
                return new Function('return ' + expr)();
            }

            window.bcTrig = {
                sin: (x) => isDegree ? Math.sin(x * Math.PI / 180) : Math.sin(x),
                cos: (x) => isDegree ? Math.cos(x * Math.PI / 180) : Math.cos(x),
                tan: (x) => isDegree ? Math.tan(x * Math.PI / 180) : Math.tan(x),
                asin: (x) => isDegree ? Math.asin(x) * 180 / Math.PI : Math.asin(x),
                acos: (x) => isDegree ? Math.acos(x) * 180 / Math.PI : Math.acos(x),
                atan: (x) => isDegree ? Math.atan(x) * 180 / Math.PI : Math.atan(x)
            };
            window.bcFact = function(n) {
                if(n < 0 || !Number.isInteger(n)) return NaN;
                if(n === 0) return 1; let res = 1; for(let i = 1; i <= n; i++) res *= i; return res;
            };
            window.bcLogY = function(x, y) { return Math.log(x) / Math.log(y); };
            window.bcNthRoot = function(x, y) { return Math.pow(x, 1/y); };

            function drawGraph(exprStr) {
                let container = document.getElementById('bc-output-box');
                let canvas = document.getElementById('bc-graph-canvas');
                if(!canvas) {
                    canvas = document.createElement('canvas'); canvas.id = 'bc-graph-canvas';
                    canvas.style.position = 'absolute'; canvas.style.top = '0'; canvas.style.left = '0'; canvas.style.pointerEvents = 'none'; 
                    container.appendChild(canvas);
                }
                let w = container.clientWidth; let h = container.clientHeight;
                canvas.width = w; canvas.height = h;
                let ctx = canvas.getContext('2d');
                
                ctx.clearRect(0,0,w,h);
                ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(0, h/2); ctx.lineTo(w, h/2); ctx.moveTo(w/2, 0); ctx.lineTo(w/2, h); ctx.stroke();
                ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.beginPath();
                
                let compiled = null;
                try { compiled = math.compile(exprStr); } catch(e) { return; }
                let scaleX = w / 20; let scaleY = h / 20; let prevY = null;
                for(let i=0; i<w; i++) {
                    let x = (i - w/2) / scaleX;
                    try {
                        let y = compiled.evaluate({x: x});
                        if(Math.abs(y) > 100) { prevY = null; continue; } 
                        let py = (h/2) - (y * scaleY);
                        if(prevY === null || Math.abs(py - prevY) > h) { ctx.moveTo(i, py); } else { ctx.lineTo(i, py); }
                        prevY = py;
                    } catch(e) { prevY = null; }
                }
                ctx.stroke();
            }

            function bcSmartSyntax(inputStr) {
                return inputStr
                    .replace(/(\d+\.?\d*)(bcFact)/g, '$2($1)')
                    .replace(/(Math\.log10|Math\.log2|Math\.(?!PI|E|log10|log2)[a-zA-Z]+|bcTrig\.[a-zA-Z]+|bc[A-zA-Z]+)(\d+\.?\d*|[x-z])/g, '$1($2)')
                    .replace(/(^|[^a-zA-Z0-9_.])(\d+\.?\d*)(x|y|z|\(|Math|bc|i)/g, '$1$2*$3') 
                    .replace(/\)(x|y|z|\(|Math|bc|i)/g, ')*$1')
                    .replace(/(Math\.PI|Math\.E|i)(\d+\.?\d*)/g, '$1*$2');
            }

            function bcUpdate() {
                let visual = bcInput
                    .replace(/Math\.asinh/g, 'sinh⁻¹').replace(/Math\.acosh/g, 'cosh⁻¹').replace(/Math\.atanh/g, 'tanh⁻¹')
                    .replace(/bcTrig\.asin/g, 'sin⁻¹').replace(/bcTrig\.acos/g, 'cos⁻¹').replace(/bcTrig\.atan/g, 'tan⁻¹')
                    .replace(/bcTrig\.sin/g, 'sin').replace(/bcTrig\.cos/g, 'cos').replace(/bcTrig\.tan/g, 'tan')
                    .replace(/Math\.PI/g, 'π').replace(/Math\.E/g, 'e').replace(/Math\.sinh/g, 'sinh')
                    .replace(/Math\.cosh/g, 'cosh').replace(/Math\.tanh/g, 'tanh').replace(/Math\.sqrt/g, '√')
                    .replace(/Math\.cbrt/g, '∛').replace(/Math\.log10/g, 'log').replace(/Math\.log2/g, 'log₂')
                    .replace(/Math\.random\(\)/g, 'RND').replace(/Math\.exp/g, 'e^').replace(/bcLogY/g, 'logᵧ')
                    .replace(/bcNthRoot/g, 'ʸ√').replace(/bcFact/g, 'fact').replace(/Math\.log/g, 'ln')
                    .replace(/Math\.abs/g, 'abs').replace(/\*10\*\*/g, '×10^');
                    
                visual = visual.replace(/\*\*/g, '^');
                visual = visual.replace(/\^([+\-]?\d*\.?\d+|\([^)]*\)?|[+\-]|\w+)/g, function(match, capture) {
                    const map = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻','+':'⁺','.':'⋅','(':'⁽',')':'⁾','x':'ˣ','y':'ʸ','n':'ⁿ'};
                    return capture.split('').map(c => map[c] || c).join('');
                });

                visual = visual.replace(/\*/g, '*').replace(/\//g, '/').replace(/-/g, '-');
                bcDisp.textContent = cleanBloggerEntities(visual || '0');

                let activeTab = document.querySelector('.bc-tab-pane.active').id;
                let calcInput = bcSmartSyntax(bcInput.replace(/\(\-/g, '(-1*'));
                
                if (activeTab === 'bc-basic' || activeTab === 'bc-sci-desktop' || activeTab === 'bc-gate') {
                    if (calcInput && !calcInput.match(/[A-Za-z_]/)) { 
                        try {
                            let result = secureEvaluate(calcInput);
                            if (isFinite(result) && !isNaN(result)) {
                                result = Math.round(result * 1e12) / 1e12; 
                                bcLiveOut.innerText = cleanBloggerEntities('= ' + result);
                            } else { bcLiveOut.innerText = ''; }
                        } catch (e) { bcLiveOut.innerText = ''; }
                    } else { bcLiveOut.innerText = ''; }
                }
            }

            return {
                switchTab: function(tabId, btnElement) {
                    if (tabId !== 'bc-history-tab') { bcLastActiveTabId = tabId; }
                    document.querySelectorAll('.bc-tab-pane').forEach(el => el.classList.remove('active'));
                    document.querySelectorAll('.bc-tab-btn').forEach(el => el.classList.remove('active'));
                    document.getElementById(tabId).classList.add('active');
                    btnElement.classList.add('active');

                    if (['bc-cas', 'bc-adv', 'bc-prog', 'bc-graph'].includes(tabId)) {
                        bcLoadAdvancedEngines();
                    }

                    let outBox = document.getElementById('bc-output-box');
                    let canvas = document.getElementById('bc-graph-canvas');
                    if(tabId === 'bc-graph') {
                        outBox.style.height = '140px'; if(canvas) canvas.style.display = 'block';
                    } else {
                        outBox.style.height = '38px'; if(canvas) canvas.style.display = 'none';
                    }
                },
                historyBack: function() {
                    const returnBtn = document.getElementById('btn-' + bcLastActiveTabId);
                    if (returnBtn) { this.switchTab(bcLastActiveTabId, returnBtn); }
                },
                setAngle: function(unit) {
                    isDegree = (unit === 'deg');
                    document.querySelectorAll('.bc-btn-deg').forEach(b => b.classList.toggle('active', unit === 'deg'));
                    document.querySelectorAll('.bc-btn-rad').forEach(b => b.classList.toggle('active', unit === 'rad'));
                    bcUpdate(); 
                },
                num: function(val) {
                    if (bcDisp.textContent === '0' && !val.includes('Math') && !val.includes('bcTrig') && val !== '.' && val !== 'Ans') { bcInput = val; } 
                    else { bcInput += val; }
                    bcUpdate();
                },
                op: function(operator) { bcInput += operator; bcUpdate(); },
                func: function(functionCall) { bcInput += functionCall; bcUpdate(); },
                ans: function() { this.num(lastAnswer.toString()); },
                toggleSign: function() {
                    if(bcInput.startsWith('(-')) bcInput = bcInput.substring(2);
                    else bcInput = '(-' + bcInput; bcUpdate();
                },
                clear: function() { bcInput = ''; bcDisp.textContent = '0'; bcLiveOut.innerText = ''; },
                back: function() {
                    bcInput = bcInput.toString().slice(0, -1);
                    if(bcInput === '') bcDisp.textContent = '0'; else bcUpdate();
                },
                mem: function(action) {
                    let currentVal = 0;
                    try { currentVal = secureEvaluate(bcInput) || 0; } catch(e){}
                    if(action === 'mc') memoryValue = 0;
                    if(action === 'mr') this.num(memoryValue.toString());
                    if(action === 'ms') memoryValue = currentVal;
                    if(action === 'm+') memoryValue += currentVal;
                    if(action === 'm-') memoryValue -= currentVal;
                    bcMemInd.innerText = memoryValue !== 0 ? 'M = ' + memoryValue : '';
                },
                finComp: function() {
                    isCompMode = true; bcLiveOut.innerText = 'Select variable (PV, FV, PMT)';
                },
                finKey: function(v) {
                    if(isCompMode) {
                        let n = finTvm.n, i = finTvm.i / 100, pv = finTvm.pv, pmt = finTvm.pmt, fv = finTvm.fv;
                        let res = 0;
                        if(v==='pv') { res = i===0 ? -(fv + pmt*n) : -(pmt * (1 - Math.pow(1+i, -n))/i + fv * Math.pow(1+i, -n)); }
                        if(v==='fv') { res = i===0 ? -(pv + pmt*n) : -(pv * Math.pow(1+i, n) + pmt * (Math.pow(1+i, n) - 1)/i); }
                        if(v==='pmt') { res = i===0 ? -(fv + pv)/n : (-fv - pv * Math.pow(1+i, n)) * i / (Math.pow(1+i, n) - 1); }
                        finTvm[v] = res; bcInput = res.toFixed(2);
                        bcLiveOut.innerText = v.toUpperCase() + ' = ' + res.toFixed(2);
                        isCompMode = false; bcUpdate();
                    } else {
                        finTvm[v] = parseFloat(bcInput) || parseFloat(bcLiveOut.innerText.split('= ')[1]) || 0;
                        bcLiveOut.innerText = v.toUpperCase() + ' SET TO ' + finTvm[v];
                        bcInput = ''; bcDisp.textContent = '0';
                    }
                },
                clearHistory: function() {
                    bcHistList.innerHTML = '<div class="hist-empty">No calculations yet</div>'; historyEmpty = true;
                },
                calc: function() {
                    if(!bcInput) return;
                    let openParentheses = (bcInput.match(/\(/g) || []).length;
                    let closeParentheses = (bcInput.match(/\)/g) || []).length;
                    while(openParentheses > closeParentheses) { bcInput += ')'; openParentheses--; }

                    let activeTab = document.querySelector('.bc-tab-pane.active').id;
                    let calcInput = bcSmartSyntax(bcInput.replace(/\(\-/g, '(-1*'));
                    
                    try {
                        bcUpdate(); 
                        let oldVisual = bcDisp.textContent; 
                        let result = '';

                        if (activeTab === 'bc-cas' || activeTab === 'bc-adv') {
                            if(extEnginesLoaded && typeof Algebrite !== 'undefined') {
                                let algInput = calcInput.replace(/\*\*/g, '^');
                                result = Algebrite.run(algInput);
                                if(result === '' || result.includes('Stop')) throw new Error("Parse Error");
                            } else { throw new Error("Loading"); }
                        } 
                        else if (activeTab === 'bc-graph') {
                            if(extEnginesLoaded && typeof math !== 'undefined') {
                                let expr = calcInput.replace(/\*\*/g, '^');
                                drawGraph(expr); bcLiveOut.innerText = 'y = ' + expr;
                                if (historyEmpty) { bcHistList.innerHTML = ''; historyEmpty = false; }
                                bcHistList.innerHTML = '<div class="hist-entry">Plotted: <strong>y = ' + oldVisual + '</strong></div>' + bcHistList.innerHTML;
                                return; 
                            } else { throw new Error("Loading"); }
                        }
                        else if (activeTab === 'bc-prog') {
                            if(extEnginesLoaded && typeof math !== 'undefined') {
                                let mRes = math.evaluate(calcInput.replace(/\*\*/g, '^'));
                                result = (mRes && typeof mRes.entries !== 'undefined') ? mRes.entries[mRes.entries.length - 1] : mRes;
                            } else { throw new Error("Loading"); }
                        }
                        else {
                            result = secureEvaluate(calcInput);
                            if(!isFinite(result) || isNaN(result)) throw new Error("Math Error");
                            result = Math.round(result * 1e12) / 1e12; 
                        }
                        
                        lastAnswer = result; 
                        if (historyEmpty) { bcHistList.innerHTML = ''; historyEmpty = false; }
                        bcHistList.innerHTML = '<div class="hist-entry">' + oldVisual + ' = <strong>' + cleanBloggerEntities(result.toString()) + '</strong></div>' + bcHistList.innerHTML;
                        
                        bcInput = result.toString();
                        bcUpdate(); 
                        bcLiveOut.innerText = cleanBloggerEntities('= ' + result);
                        
                    } catch (e) {
                        if(e.message === "Loading") {
                            bcLiveOut.innerText = 'Loading Modules...';
                        } else {
                            bcLiveOut.innerText = 'Syntax Error';
                        }
                        setTimeout(() => { 
                            if(bcLiveOut.innerText === 'Syntax Error' || bcLiveOut.innerText === 'Loading Modules...') {
                                bcLiveOut.innerText = ''; 
                            }
                        }, 1500);
                    }
                }
            };
        })();
    </script>
    
    <script>
        function sendHeightToParent() {
            const calcWidget = document.getElementById('blogger-calc-widget');
            if (calcWidget) {
                const calcHeight = calcWidget.getBoundingClientRect().height + 8; 
                window.parent.postMessage({ frameHeight: calcHeight }, '*');
            }
        }

        window.addEventListener('load', () => setTimeout(sendHeightToParent, 80));
        window.addEventListener('resize', sendHeightToParent);

        document.querySelectorAll('.bc-tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                setTimeout(sendHeightToParent, 40);
            });
        });
    </script>
</div>
