<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculator Widget</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: Arial, Helvetica, sans-serif;
            box-sizing: border-box;
            overflow: hidden;
            touch-action: manipulation;
        }
    </style>
</head>
<body>

<div class="blogger-calc-classic" id="blogger-calc-widget">
    <style>
        /* CLEAN HIGH-READABILITY SHELL */
        .blogger-calc-classic {
            width: 100%;
            max-width: 630px; 
            margin: 0 auto !important; 
            box-sizing: border-box;
            background: #eef3f8;
            border: 1px solid #9fb4cb;
            border-radius: 6px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.1);
            padding: 8px; 
            position: relative;
        }

        .blogger-calc-classic *, .blogger-calc-classic *::before, .blogger-calc-classic *::after { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }

        /* TABS CONTAINER WITH SUBTLE 3D LIFT */
        .bc-tabs {
            display: flex; 
            margin-bottom: 6px; 
            border-bottom: 2px solid #2563eb;
            overflow-x: auto; 
            scrollbar-width: none; 
            white-space: nowrap;
            gap: 3px;
            padding-bottom: 0;
            align-items: center;
        }
        .bc-tabs::-webkit-scrollbar { display: none; } 

        /* FILTER BUTTON (SLIM, SAME SIZE AS TAB BUTTONS) */
        .bc-theme-select {
            font-family: inherit;
            padding: 6px 8px;
            background: #0f172a !important;
            border: 1px solid #0f172a !important;
            border-radius: 4px 4px 0 0;
            font-size: 13px !important;
            font-weight: 800 !important;
            color: #ffffff !important;
            cursor: pointer;
            outline: none;
            flex-shrink: 0;
            white-space: nowrap;
            text-align: center;
            letter-spacing: -0.2px;
        }

        .bc-tab-btn {
            font-family: inherit;
            padding: 6px 11px; 
            background: #ffffff !important; 
            border: 1px solid #94a3b8 !important; 
            border-bottom: none !important; 
            border-radius: 4px 4px 0 0;
            font-size: 13px !important; 
            font-weight: 800 !important; 
            letter-spacing: -0.2px;
            color: #000000 !important; 
            cursor: pointer;
            transition: all 0.1s ease; 
            flex-shrink: 0;
            -webkit-font-smoothing: antialiased;
            box-shadow: 0 -2px 3px rgba(0,0,0,0.04);
        }
        .bc-tab-btn:hover { 
            color: #2563eb !important; 
            background: #f8fafc !important; 
        }
        .bc-tab-btn.active {
            background: #2563eb !important; 
            color: #ffffff !important; 
            border-color: #2563eb !important;
            margin-bottom: -1px;
            box-shadow: 0 -3px 6px rgba(37, 99, 235, 0.25);
        }

        #btn-bc-history-tab {
            background: #0f172a !important;
            color: #ffffff !important;
            border-color: #0f172a !important;
            position: sticky;
            right: 0;
            z-index: 10;
            text-transform: uppercase;
            font-size: 12px !important;
            font-weight: 800 !important;
        }
        #btn-bc-history-tab.active {
            background: #2563eb !important;
            border-color: #2563eb !important;
        }

        /* DESKTOP VIEWPORT: SHARP READABLE TAB LABELS */
        @media (min-width: 601px) {
            .bc-tab-btn {
                font-size: 16.5px !important;
                font-weight: 800 !important;
                letter-spacing: -0.35px;
                padding: 6px 9px;
            }
            .bc-theme-select {
                font-size: 14.5px !important;
                padding: 6px 8px;
            }
            #btn-bc-history-tab {
                font-size: 14.5px !important;
                padding: 6px 9px;
            }
        }

        /* SCREEN */
        .bc-screen-container {
            border: 1px solid #7c93ab;
            border-radius: 4px; 
            margin-bottom: 6px; 
            display: flex; 
            flex-direction: column;
            overflow: hidden; 
            background: #ffffff;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
        }

        .bc-input-box {
            background: #ffffff; 
            color: #000000 !important; 
            border: none;
            width: 100%; 
            padding: 4px 8px 0; 
            font-size: 16px !important; 
            font-weight: 900; 
            text-align: right; 
            outline: none; 
            font-family: inherit; 
            height: 22px; 
            line-height: 22px;
            white-space: nowrap; 
            overflow-x: auto;
            user-select: none;
        }

        .bc-output-box {
            background: #3b5998; 
            color: #ffffff !important; 
            padding: 2px 8px;
            font-size: 28px !important; 
            text-align: right; 
            font-weight: 900 !important; 
            height: 38px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            font-family: inherit; 
            white-space: nowrap; 
            overflow-x: auto; 
            overflow-y: hidden;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.25);
        }
        
        .bc-mem-indicator { font-size: 12px; font-weight: 900; color: #dceefb; z-index: 10; }
        #bc-live-out { z-index: 10; font-weight: 900; }

        .bc-input-box::-webkit-scrollbar, .bc-output-box::-webkit-scrollbar { height: 3px; }
        .bc-input-box::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
        .bc-output-box::-webkit-scrollbar-thumb { background: #93c5fd; border-radius: 2px; }

        /* KEYPAD WORKSPACE */
        .bc-keypad-container {
            height: 255px;
            min-height: 255px;
            max-height: 255px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .bc-tab-pane { 
            display: none !important; 
            gap: 3px; 
            height: 100%;
            width: 100%;
            grid-auto-rows: 1fr; 
        }
        .bc-tab-pane.active { display: grid !important; }
        #bc-history-tab.active { display: flex !important; }

        .bc-grid-basic { grid-template-columns: repeat(4, 1fr); max-width: 350px; margin: 0 auto; }
        .bc-grid-sci-desktop { grid-template-columns: repeat(10, 1fr); }
        .bc-grid-gate { grid-template-columns: repeat(11, 1fr); }
        .bc-grid-adv { grid-template-columns: repeat(10, 1fr); }
        .bc-grid-prog { grid-template-columns: repeat(9, 1fr); }
        .bc-grid-graph { grid-template-columns: repeat(9, 1fr); }
        .bc-grid-cas { grid-template-columns: repeat(10, 1fr); }
        .bc-grid-fin { grid-template-columns: repeat(8, 1fr); }

        /* MODERN TACTILE 3D BUTTON ENGINE */
        .bc-btn {
            font-family: inherit; 
            border: 1px solid #94a8be; 
            border-top: 1px solid #ffffff;
            border-radius: 4px; 
            height: 100%; 
            width: 100%;
            font-size: 15px !important; 
            font-weight: 900 !important; 
            letter-spacing: -0.2px;
            cursor: pointer; 
            display: flex;
            align-items: center; 
            justify-content: center; 
            user-select: none;
            background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%); 
            color: #000000 !important; 
            padding: 0 1px;
            box-shadow: 0 3px 0 #94a8be, 0 4px 5px rgba(15, 23, 42, 0.1);
            transition: transform 0.04s ease, box-shadow 0.04s ease, background 0.08s ease;
        }
        .bc-btn:hover { 
            background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%); 
        }
        .bc-btn:active { 
            transform: translateY(2px); 
            box-shadow: 0 1px 0 #94a8be, 0 1px 2px rgba(15, 23, 42, 0.15) !important;
        }

        /* 1. NUMBERS */
        .bc-btn-num { 
            background: linear-gradient(180deg, #dce8f5 0%, #c6d9ec 100%) !important; 
            color: #000000 !important; 
            font-size: 20px !important; 
            font-weight: 900 !important;
            border-color: #92b0d0 !important;
            border-top: 1px solid #edf3fa !important;
            box-shadow: 0 3px 0 #85a4c5, 0 4px 5px rgba(15, 23, 42, 0.12) !important;
        }
        .bc-btn-num:hover { 
            background: linear-gradient(180deg, #d3e1f0 0%, #b8cfe6 100%) !important; 
        }
        .bc-btn-num:active { 
            transform: translateY(2px);
            box-shadow: 0 1px 0 #85a4c5, 0 1px 2px rgba(15, 23, 42, 0.15) !important;
        }

        /* 2. OPERATORS */
        .bc-btn-op,
        .bc-btn[aria-label="Add"],
        .bc-btn[aria-label="Subtract"],
        .bc-btn[aria-label="Multiply"],
        .bc-btn[aria-label="Divide"],
        .bc-btn[aria-label="Modulo"],
        .bc-btn[aria-label="Modulo or Percent"],
        .bc-btn[aria-label="Percent"] {
            font-size: 19px !important;
            font-weight: 900 !important;
            background: linear-gradient(180deg, #edf3fa 0%, #dce7f3 100%) !important;
            border-color: #9fb7cf !important;
            border-top: 1px solid #ffffff !important;
            box-shadow: 0 3px 0 #91a8c0, 0 4px 5px rgba(15, 23, 42, 0.12) !important;
            color: #000000 !important;
        }
        .bc-btn-op:hover {
            background: linear-gradient(180deg, #e4ecf7 0%, #d1deed 100%) !important;
        }
        .bc-btn-op:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #91a8c0, 0 1px 2px rgba(15, 23, 42, 0.15) !important;
        }

        /* 3. EQUALS (=) - PERMANENTLY LOCKED VIBRANT BLUE */
        .bc-btn-primary,
        .bc-btn[aria-label="Calculate Equals"] { 
            background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%) !important; 
            color: #ffffff !important; 
            border-color: #1d4ed8 !important; 
            border-top: 1px solid #93c5fd !important;
            box-shadow: 0 3px 0 #1e40af, 0 4px 6px rgba(37, 99, 235, 0.35) !important;
            font-size: 22px !important; 
            font-weight: 900 !important;
        }
        .bc-btn-primary:hover { 
            background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%) !important; 
        }
        .bc-btn-primary:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1e40af, 0 1px 2px rgba(37, 99, 235, 0.4) !important;
        }

        /* 4. CLEAR / AC - PERMANENTLY LOCKED CRIMSON RED */
        .bc-btn-danger,
        .bc-btn[aria-label="Clear All"] { 
            background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%) !important; 
            color: #ffffff !important; 
            border-color: #b91c1c !important; 
            border-top: 1px solid #fca5a5 !important;
            box-shadow: 0 3px 0 #991b1b, 0 4px 6px rgba(220, 38, 38, 0.35) !important;
            font-size: 15px !important; 
            font-weight: 900 !important;
        }
        .bc-btn-danger:hover { 
            background: linear-gradient(180deg, #dc2626 0%, #b91c1c 100%) !important; 
        }
        .bc-btn-danger:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #991b1b, 0 1px 2px rgba(220, 38, 38, 0.4) !important;
        }

        /* 5. BACKSPACE / DELETE - PERMANENTLY LOCKED SUNSET AMBER */
        .bc-btn-delete,
        .bc-btn[aria-label="Backspace"] {
            background: linear-gradient(180deg, #f97316 0%, #ea580c 100%) !important;
            color: #ffffff !important;
            border-color: #c2410c !important;
            border-top: 1px solid #fed7aa !important;
            box-shadow: 0 3px 0 #9a3412, 0 4px 6px rgba(234, 88, 12, 0.35) !important;
            font-size: 15px !important;
            font-weight: 900 !important;
        }
        .bc-btn-delete:hover { 
            background: linear-gradient(180deg, #ea580c 0%, #c2410c 100%) !important; 
        }
        .bc-btn-delete:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #9a3412, 0 1px 2px rgba(234, 88, 12, 0.4) !important;
        }

        /* 6. DEG / RAD */
        .bc-btn-deg, .bc-btn-rad {
            font-size: 13px !important;
            font-weight: 900 !important;
            background: linear-gradient(180deg, #f1f5f9 0%, #dbe4ef 100%);
            color: #000000 !important;
            border-color: #94a8be;
            border-top: 1px solid #ffffff;
            box-shadow: 0 3px 0 #8598ad, 0 4px 5px rgba(15, 23, 42, 0.1);
        }
        .bc-btn-deg.active, .bc-btn-rad.active {
            background: linear-gradient(180deg, #1e3a8a 0%, #172554 100%) !important;
            color: #ffffff !important;
            border-color: #0f172a !important;
            border-top: 1px solid #3b82f6 !important;
            box-shadow: 0 3px 0 #020617, 0 4px 6px rgba(15, 23, 42, 0.4) !important;
        }
        .bc-btn-deg:active, .bc-btn-rad:active {
            transform: translateY(2px);
        }

        .bc-btn-action { 
            background: linear-gradient(180deg, #f8fafc 0%, #e1ebf5 100%); 
            color: #000000 !important; 
            font-size: 13px !important;
            font-weight: 900 !important;
            border-color: #a3bacc;
            border-top: 1px solid #ffffff;
            box-shadow: 0 3px 0 #92a9bf, 0 4px 5px rgba(15, 23, 42, 0.1);
        }

        .bc-btn-special { 
            background: linear-gradient(180deg, #fffbeb 0%, #fef3c7 100%); 
            color: #000000 !important; 
            border-color: #fde68a;
            border-top: 1px solid #ffffff;
            box-shadow: 0 3px 0 #d97706, 0 4px 5px rgba(217, 119, 6, 0.2);
            font-size: 11px;
            font-weight: 900 !important;
        }

        /* HP 12C "COMP" KEY (same look as before, now class based) */
        .bc-btn-comp,
        .bc-btn-comp:hover {
            background: #3b5998;
            color: #ffffff !important;
        }

        .bc-span-2 { grid-column: span 2; }
        .bc-span-3 { grid-column: span 3; }
        .bc-span-4 { grid-column: span 4; }
        .bc-span-5 { grid-column: span 5; }
        .bc-span-6 { grid-column: span 6; }
        .bc-span-9 { grid-column: span 9; }
        .bc-span-10 { grid-column: span 10; }

        /* HISTORY */
        #bc-history-tab { 
            background: #ffffff; 
            border: 1px solid #9fb4cb; 
            border-radius: 4px; 
            padding: 8px; 
            flex-direction: column; 
            height: 100% !important;
            box-sizing: border-box;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.04);
        }
        .bc-history-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #d0dce7; padding-bottom: 4px; margin-bottom: 6px; flex-shrink: 0; }
        .bc-history-title { font-weight: 900; color: #3b5998; font-size: 13px; text-transform: uppercase; }
        .bc-history-back-btn, .bc-clear-history { font-size: 11px; font-weight: 900; cursor: pointer; padding: 3px 8px; border-radius: 3px; border: 1px solid transparent; text-transform: uppercase; box-shadow: 0 2px 0 rgba(0,0,0,0.15); }
        .bc-history-back-btn { background: #3b5998; color: #ffffff; }
        .bc-clear-history { background: #dc2626; color: #ffffff; }
        .bc-history-list { flex-grow: 1; overflow-y: auto; font-family: inherit; font-size: 14px; }
        .hist-entry { margin-bottom: 4px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 3px; text-align: left; color: #000000; font-weight: 900; }
        .hist-entry strong { color: #3b5998; font-weight: 900 !important; }
        .hist-empty { color: #64748b; text-align: center; font-style: italic; padding-top: 40px; }

        /* ========================================================
           FILTER POP-UP PANEL (WITH 3D CANCEL ❌ BUTTON)
           ======================================================== */
        .bc-filter-panel {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 60;
            display: none;
            flex-direction: column;
            background: #eef3f8;
            border: 1px solid #9fb4cb;
            border-radius: 6px;
            padding: 8px;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.22);
        }
        .bc-filter-panel.open { display: flex; }

        .bc-filter-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 6px;
            margin-bottom: 6px;
            border-bottom: 2px solid #2563eb;
            flex-shrink: 0;
        }
        .bc-filter-title {
            font-size: 14px;
            font-weight: 900;
            color: #0f172a;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* 3D CANCEL BUTTON: solid edge shadow + soft glow shadow */
        .bc-filter-close {
            width: 34px;
            height: 34px;
            padding: 0;
            border-radius: 8px;
            border: 1px solid #fca5a5;
            border-top: 1px solid #ffffff;
            background: linear-gradient(180deg, #ffffff 0%, #fee2e2 100%);
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 0 #b91c1c, 0 6px 10px rgba(185, 28, 28, 0.35);
            transition: transform 0.04s ease, box-shadow 0.04s ease;
        }
        .bc-filter-close:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b91c1c, 0 2px 4px rgba(185, 28, 28, 0.35);
        }

        .bc-filter-list {
            flex: 1 1 auto;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            padding: 2px 2px 6px;
            align-content: start;
            -webkit-overflow-scrolling: touch;
        }
        @media (min-width: 601px) {
            .bc-filter-list { grid-template-columns: repeat(3, 1fr); }
        }

        .bc-filter-item {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 8px;
            min-width: 0;
            font-family: inherit;
            font-size: 12px;
            font-weight: 800;
            color: #000000;
            text-align: left;
            cursor: pointer;
            background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
            border: 1px solid #94a8be;
            border-top: 1px solid #ffffff;
            border-radius: 4px;
            box-shadow: 0 2px 0 #94a8be;
        }
        .bc-filter-item:active { transform: translateY(1px); box-shadow: 0 1px 0 #94a8be; }
        .bc-filter-item.sel {
            background: linear-gradient(180deg, #dbeafe 0%, #bfdbfe 100%);
            border-color: #2563eb;
            box-shadow: 0 2px 0 #1d4ed8;
        }
        .bc-filter-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.35);
            flex-shrink: 0;
        }
        .bc-filter-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }

        /* ========================================================
           FILTER THEMES - COLOURFUL BUTTONS (like the default calculator)
           Every theme gives numbers, operators, functions, actions and
           special keys their own tint. AC, Back and = stay red/orange/blue.
           ======================================================== */

        /* Theme defaults (each theme below overrides what it needs) */
        [class*="calc-theme-"] {
            --h: 215;          /* base hue */
            --s: 55;           /* base saturation % */
            --lt: 97;          /* button top lightness */
            --lb: 91;          /* button bottom lightness */
            --dir: 1;          /* 1 = light theme, -1 = dark theme */
            --edge: 26;        /* 3D bottom edge darkness */
            --bdo: -14;        /* border lightness offset */
            --tx: #0f172a;     /* button text colour */
            --a: 1;            /* button opacity (glass themes use less) */
            --lift: 3px;       /* 3D depth */
            --sh2: 0 4px 5px rgba(15, 23, 42, 0.12);
        }

        /* Category palettes: function keys */
        [class*="calc-theme-"] .bc-btn { --ch: var(--h); --cs: calc(var(--s) * 0.3); --co: 0; }
        /* numbers */
        [class*="calc-theme-"] .bc-btn-num { --ch: var(--h); --cs: var(--s); --co: 8; }
        /* operators */
        [class*="calc-theme-"] .bc-btn-op { --ch: calc(var(--h) + 45); --cs: var(--s); --co: 5; }
        /* actions (Ans, M+, MR ...) and Deg / Rad */
        [class*="calc-theme-"] .bc-btn-action,
        [class*="calc-theme-"] .bc-btn-deg,
        [class*="calc-theme-"] .bc-btn-rad { --ch: calc(var(--h) - 45); --cs: calc(var(--s) * 0.9); --co: 5; }
        /* special keys */
        [class*="calc-theme-"] .bc-btn-special { --ch: calc(var(--h) + 90); --cs: var(--s); --co: 7; }

        /* One common paint rule that uses the palette above */
        [class*="calc-theme-"] .bc-btn {
            background: linear-gradient(180deg,
                hsl(var(--ch) calc(var(--cs) * 1%) calc((var(--lt) - var(--dir) * var(--co)) * 1%) / var(--a)),
                hsl(var(--ch) calc(var(--cs) * 1%) calc((var(--lb) - var(--dir) * var(--co)) * 1%) / var(--a))) !important;
            color: var(--tx) !important;
            border-color: hsl(var(--ch) calc(var(--cs) * 1%) calc((var(--lb) - var(--dir) * var(--co) + var(--bdo)) * 1%)) !important;
            border-top-color: hsl(var(--ch) calc(var(--cs) * 1%) calc((var(--lt) - var(--dir) * var(--co) + 6) * 1%)) !important;
            box-shadow: 0 var(--lift) 0 hsl(var(--ch) calc(var(--cs) * 1%) calc((var(--lb) - var(--dir) * var(--co) - var(--edge)) * 1%)), var(--sh2) !important;
        }
        [class*="calc-theme-"] .bc-btn:active {
            box-shadow: 0 1px 0 hsl(var(--ch) calc(var(--cs) * 1%) calc((var(--lb) - var(--dir) * var(--co) - var(--edge)) * 1%)), var(--sh2) !important;
        }

        /* Selected Deg / Rad key */
        [class*="calc-theme-"] .bc-btn-deg.active,
        [class*="calc-theme-"] .bc-btn-rad.active {
            background: linear-gradient(180deg, hsl(var(--h) 65% 38%) 0%, hsl(var(--h) 65% 28%) 100%) !important;
            color: #ffffff !important;
            border-color: hsl(var(--h) 65% 20%) !important;
            border-top-color: hsl(var(--h) 65% 55%) !important;
            box-shadow: 0 var(--lift) 0 hsl(var(--h) 65% 14%), 0 4px 6px rgba(15, 23, 42, 0.35) !important;
        }

        /* 1. Black & White (grey shades by design, keys still use different shades) */
        .calc-theme-bw { background: #ffffff !important; border-color: #000000 !important; --h: 0; --s: 0; --lt: 96; --lb: 90; --tx: #000000; }
        .calc-theme-bw .bc-tabs { border-bottom-color: #000000 !important; }

    <script>
        const BloggerCalc = (function() {
            const bcDisp = document.getElementById('bc-display');
            const bcLiveOut = document.getElementById('bc-live-out');
            const bcMemInd = document.getElementById('bc-memory-indicator');
            const bcHistList = document.getElementById('bc-history-list');
            const widgetEl = document.getElementById('blogger-calc-widget');
            const filterPanel = document.getElementById('bc-filter-panel');
            const filterList = document.getElementById('bc-filter-list');
            
            let bcInput = '';
            let isDegree = true;
            let memoryValue = 0;
            let lastAnswer = 0; 
            let historyEmpty = true;
            let bcLastActiveTabId = 'bc-basic';
            let currentTheme = '';
            let filtersBuilt = false;

            let finTvm = { n: 0, i: 0, pv: 0, pmt: 0, fv: 0 };
            let isCompMode = false;

            let extEnginesLoaded = false;
            function bcLoadAdvancedEngines() {
                if (extEnginesLoaded) return;
                bcLiveOut.innerText = "Loading Modules...";
                
                let s1 = document.createElement('script');
                s1.src = "https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js";
                let s2 = document.createElement('script');
                s2.src = "https://unpkg.com/algebrite@1.4.0/dist/algebrite.bundle-for-browser.js";
                
                s2.onload = () => {
                    extEnginesLoaded = true;
                    bcLiveOut.innerText = "Modules Ready";
                    setTimeout(() => { if(bcLiveOut.innerText === "Modules Ready") bcLiveOut.innerText = ""; }, 1500);
                };
                document.head.appendChild(s1);
                document.head.appendChild(s2);
            }

            function cleanBloggerEntities(str) {
                let txt = document.createElement("textarea"); txt.innerHTML = str; return txt.value;
            }

            function secureEvaluate(expr) {
                const testStr = expr
                    .replace(/(Math\.[a-zA-Z0-9]+|bcTrig\.[a-zA-Z]+|bc[A-zA-Z]+)/g, '')
                    .replace(/[0-9+\-*/().,% eE]/g, '');
                if (testStr.length > 0) {
                    throw new Error("Invalid Input");
                }
                return new Function('return ' + expr)();
            }

            window.bcTrig = {
                sin: (x) => isDegree ? Math.sin(x * Math.PI / 180) : Math.sin(x),
                cos: (x) => isDegree ? Math.cos(x * Math.PI / 180) : Math.cos(x),
                tan: (x) => isDegree ? Math.tan(x * Math.PI / 180) : Math.tan(x),
                asin: (x) => isDegree ? Math.asin(x * 180 / Math.PI) : Math.asin(x),
                acos: (x) => isDegree ? Math.acos(x * 180 / Math.PI) : Math.acos(x),
                atan: (x) => isDegree ? Math.atan(x * 180 / Math.PI) : Math.atan(x)
            };
            window.bcFact = function(n) {
                if(n < 0 || !Number.isInteger(n)) return NaN;
                if(n === 0) return 1; let res = 1; for(let i = 1; i <= n; i++) res *= i; return res;
            };
            window.bcLogY = function(x, y) { return Math.log(x) / Math.log(y); };
            window.bcNthRoot = function(x, y) { return Math.pow(x, 1/y); };

            function drawGraph(exprStr) {
                let container = document.getElementById('bc-output-box');
                let canvas = document.getElementById('bc-graph-canvas');
                if(!canvas) {
                    canvas = document.createElement('canvas'); canvas.id = 'bc-graph-canvas';
                    canvas.style.position = 'absolute'; canvas.style.top = '0'; canvas.style.left = '0'; canvas.style.pointerEvents = 'none'; 
                    container.appendChild(canvas);
                }
                let w = container.clientWidth; let h = container.clientHeight;
                canvas.width = w; canvas.height = h;
                let ctx = canvas.getContext('2d');
                
                ctx.clearRect(0,0,w,h);
                ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(0, h/2); ctx.lineTo(w, h/2); ctx.moveTo(w/2, 0); ctx.lineTo(w/2, h); ctx.stroke();
                ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.beginPath();
                
                let compiled = null;
                try { compiled = math.compile(exprStr); } catch(e) { return; }
                let scaleX = w / 20; let scaleY = h / 20; let prevY = null;
                for(let i=0; i<w; i++) {
                    let x = (i - w/2) / scaleX;
                    try {
                        let y = compiled.evaluate({x: x});
                        if(Math.abs(y) > 100) { prevY = null; continue; } 
                        let py = (h/2) - (y * scaleY);
                        if(prevY === null || Math.abs(py - prevY) > h) { ctx.moveTo(i, py); } else { ctx.lineTo(i, py); }
                        prevY = py;
                    } catch(e) { prevY = null; }
                }
                ctx.stroke();
            }

            function bcSmartSyntax(inputStr) {
                return inputStr
                    .replace(/(\d+\.?\d*)(bcFact)/g, '$2($1)')
                    .replace(/(Math\.log10|Math\.log2|Math\.(?!PI|E|log10|log2)[a-zA-Z]+|bcTrig\.[a-zA-Z]+|bc[A-zA-Z]+)(\d+\.?\d*|[x-z])/g, '$1($2)')
                    .replace(/(^|[^a-zA-Z0-9_.])(\d+\.?\d*)(x|y|z|\(|Math|bc|i)/g, '$1$2*$3')

            function bcUpdate() {
                let visual = bcInput
                    .replace(/Math\.asinh/g, 'sinh⁻¹').replace(/Math\.acosh/g, 'cosh⁻¹').replace(/Math\.atanh/g, 'tanh⁻¹')
                    .replace(/bcTrig\.asin/g, 'sin⁻¹').replace(/bcTrig\.acos/g, 'cos⁻¹').replace(/bcTrig\.atan/g, 'tan⁻¹')
                    .replace(/bcTrig\.sin/g, 'sin').replace(/bcTrig\.cos/g, 'cos').replace(/bcTrig\.tan/g, 'tan')
                    .replace(/Math\.PI/g, 'π').replace(/Math\.E/g, 'e').replace(/Math\.sinh/g, 'sinh')
                    .replace(/Math\.cosh/g, 'cosh').replace(/Math\.tanh/g, 'tanh').replace(/Math\.sqrt/g, '√')
                    .replace(/Math\.cbrt/g, '∛').replace(/Math\.log10/g, 'log').replace(/Math\.log2/g, 'log₂')
                    .replace(/Math\.random\(\)/g, 'RND').replace(/Math\.exp/g, 'e^').replace(/bcLogY/g, 'logᵧ')
                    .replace(/bcNthRoot/g, 'ʸ√').replace(/bcFact/g, 'fact').replace(/Math\.log/g, 'ln')
                    .replace(/Math\.abs/g, 'abs').replace(/\*10\*\*/g, '×10^');
                    
                visual = visual.replace(/\*\*/g, '^');
                visual = visual.replace(/\^([+\-]?\d*\.?\d+|\([^)]*\)?|[+\-]|\w+)/g, function(match, capture) {
                    const map = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻','+':'⁺','.':'⋅','(':'⁽',')':'⁾','x':'ˣ','y':'ʸ','n':'ⁿ'};
                    return capture.split('').map(c => map[c] || c).join('');
                });

                visual = visual.replace(/\*/g, '*').replace(/\//g, '/').replace(/-/g, '-');
                bcDisp.textContent = cleanBloggerEntities(visual || '0');

                let activeTab = document.querySelector('.bc-tab-pane.active').id;
                let calcInput = bcSmartSyntax(bcInput.replace(/\(\-/g, '(-1*'));
                
                if (activeTab === 'bc-basic' || activeTab === 'bc-sci-desktop' || activeTab === 'bc-gate') {
                    if (calcInput && !calcInput.match(/[A-Za-z_]/)) { 
                        try {
                            let result = secureEvaluate(calcInput);
                            if (isFinite(result) && !isNaN(result)) {
                                result = Math.round(result * 1e12) / 1e12; 
                                bcLiveOut.innerText = cleanBloggerEntities('= ' + result);
                            } else { bcLiveOut.innerText = ''; }
                        } catch (e) { bcLiveOut.innerText = ''; }
                    } else { bcLiveOut.innerText = ''; }
                }
            }
