<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Interactive Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body {
    background: transparent;
    display: flex;
    justify-content: center;
    padding: 10px;
  }
  .calc-wrap {
    width: 100%;
    max-width: 340px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    .calc-wrap { background: #151c2e; border-color: #232d42; color: #f8fafc; }
  }
  #display {
    width: 100%;
    height: 52px;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    font-size: 1.5rem;
    font-weight: 700;
    text-align: right;
    padding: 0 12px;
    margin-bottom: 14px;
    color: inherit;
    outline: none;
  }
  @media (prefers-color-scheme: dark) {
    #display { background: #0b0f19; border-color: #334155; }
  }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  button {
    height: 48px;
    font-size: 1.15rem;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    background: #f1f5f9;
    color: #0f172a;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:active { transform: scale(0.96); }
  @media (prefers-color-scheme: dark) {
    button { background: #1e293b; color: #f8fafc; }
  }
  button.op { background: #e0f2fe; color: #0284c7; }
  @media (prefers-color-scheme: dark) { button.op { background: #0369a1; color: #e0f2fe; } }
  button.action { background: #fee2e2; color: #ef4444; }
  @media (prefers-color-scheme: dark) { button.action { background: #991b1b; color: #fecaca; } }
  button.eq { background: #0071e3; color: #ffffff; grid-column: span 2; }
</style>
</head>
<body>

<div class="calc-wrap">
  <input type="text" id="display" readonly placeholder="0">
  <div class="keys">
    <button class="action" onclick="cAll()">C</button>
    <button class="action" onclick="del()">⌫</button>
    <button class="op" onclick="ins('/')">÷</button>
    <button class="op" onclick="ins('*')">×</button>
    <button onclick="ins('7')">7</button>
    <button onclick="ins('8')">8</button>
    <button onclick="ins('9')">9</button>
    <button class="op" onclick="ins('-')">−</button>
    <button onclick="ins('4')">4</button>
    <button onclick="ins('5')">5</button>
    <button onclick="ins('6')">6</button>
    <button class="op" onclick="ins('+')">+</button>
    <button onclick="ins('1')">1</button>
    <button onclick="ins('2')">2</button>
    <button onclick="ins('3')">3</button>
    <button class="op" onclick="ins('%')">%</button>
    <button onclick="ins('0')">0</button>
    <button onclick="ins('.')">.</button>
    <button class="eq" onclick="solve()">=</button>
  </div>
</div>

<script>
  var disp = document.getElementById('display');
  function ins(val) { disp.value += val; sendHeight(); }
  function cAll() { disp.value = ''; sendHeight(); }
  function del() { disp.value = disp.value.slice(0, -1); sendHeight(); }
  function solve() {
    try {
      disp.value = Function('"use strict";return (' + disp.value + ')')();
    } catch(e) {
      disp.value = 'Error';
    }
    sendHeight();
  }
  function sendHeight() {
    var h = document.body.scrollHeight;
    window.parent.postMessage({ frameHeight: h }, '*');
  }
  window.addEventListener('load', sendHeight);
  window.addEventListener('resize', sendHeight);
</script>
</body>
</html>
