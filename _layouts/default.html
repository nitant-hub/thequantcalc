<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "thequantcals" }}</title>
    
    <style>
        :root {
            --bg-primary: #f4f6f9;
            --bg-surface: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-gradient: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            --header-height: 55px; 
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-surface: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; transition: background-color 0.25s, color 0.25s; }
        body { background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; padding-top: var(--header-height); }

        /* Header */
        header#siteHeader {
            position: fixed; top: 0; left: 0; width: 100%; height: var(--header-height); z-index: 10000;
            background: linear-gradient(135deg, #020818 0%, #0d1f5c 40%, #1a3a8f 75%, #0e2d6b 100%);
            border-bottom: 1px solid rgba(99, 179, 255, 0.25);
            box-shadow: 0 4px 30px rgba(10, 20, 80, 0.6);
            padding: 0 1rem; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
        }

        .brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; flex-shrink: 0; }
        .logo-symbol { background: var(--accent-gradient); width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
        .brand-title { font-size: 1.15rem; font-weight: 800; background: linear-gradient(90deg, #e0f2fe 0%, #bae6fd 60%, #c7d2fe 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Desktop header links: hidden on mobile */
        .desktop-nav { display: none; align-items: stretch; height: 100%; margin-left: auto; background: rgba(0, 0, 0, 0.2); }
        .desktop-nav a {
            text-decoration: none; color: #ffffff; font-weight: 700; font-size: 0.8rem;
            text-transform: uppercase; padding: 0 1rem; display: flex; align-items: center;
            background: rgba(15, 30, 70, 0.6); border-top: 3px solid transparent; white-space: nowrap;
        }
        .desktop-nav a:hover, .desktop-nav a.on { background: #1e3a8a; border-top-color: #3b82f6; }

        .nav-actions { display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }
        .theme-toggle { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #ffffff; padding: 4px; }

        /* Hamburger: visible on mobile */
        .menu-btn { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; gap: 5px; padding: 6px; }
        .menu-btn span { width: 24px; height: 3px; background-color: #ffffff; border-radius: 2px; display: block; }

        .nav-menu {
            position: fixed; top: 0; right: -300px; width: 280px; max-width: 85%; height: 100vh;
            background: var(--bg-surface); border-left: 1px solid var(--border-color);
            padding: 4.5rem 1.5rem 2rem; display: flex; flex-direction: column; gap: 1.1rem;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 10001;
            box-shadow: -10px 0 30px rgba(0,0,0,0.15); overflow-y: auto;
        }
        .nav-menu.active { right: 0; }
        .nav-menu a { text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 1.05rem; }
        .nav-menu a:hover, .nav-menu a.on { color: #2563eb; }
        .nav-menu .lbl { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; font-weight: 700; }
        .close-menu-btn { position: absolute; top: 1rem; right: 1.2rem; background: none; border: none; font-size: 2rem; color: var(--text-muted); cursor: pointer; line-height: 1; }

        /* Layout grid */
        .wrapper { max-width: 1200px; width: 100%; margin: 2rem auto; padding: 0 1rem; flex: 1; }
        .layout-grid { display: grid; grid-template-columns: 1fr; gap: 2rem; }
        .main-body { display: flex; flex-direction: column; gap: 2rem; width: 100%; min-width: 0; }

        .sidebar { background: var(--bg-surface); padding: 1.75rem; border-radius: 16px; border: 1px solid var(--border-color); height: fit-content; }
        .sidebar h3 { font-size: 1.15rem; margin-bottom: 1.2rem; border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem; font-weight: 700; }
        .sidebar-list { list-style: none; display: flex; flex-direction: column; gap: 1rem; }
        .sidebar-list a { text-decoration: none; color: var(--text-main); font-size: 0.95rem; font-weight: 500; }
        .sidebar-list a:hover { color: #7c3aed; }

        footer { background: var(--bg-surface); border-top: 1px solid var(--border-color); padding: 2.5rem 1.5rem; text-align: center; color: var(--text-muted); margin-top: 4rem; font-size: 0.9rem; }
        footer nav { display: flex; justify-content: center; gap: 1.5rem; margin-top: 1.2rem; flex-wrap: wrap; }
        footer a { color: var(--text-muted); text-decoration: none; }

        /* DESKTOP (also Chrome "Desktop site"): header links + More, NO hamburger */
        @media (min-width: 768px) {
            header#siteHeader { padding: 0 1.5rem; }
            .desktop-nav { display: flex; margin-right: 1rem; }
            .menu-btn, .nav-menu { display: none !important; }
            .brand-title { font-size: 1.25rem; }
            .layout-grid { grid-template-columns: 2.5fr 1fr; align-items: start; }
            .sidebar { position: sticky; top: calc(var(--header-height) + 2rem); }
        }

        /* MOBILE: hamburger only, no sidebar */
        @media (max-width: 767px) {
            .sidebar { display: none; }
            .wrapper { padding: 0 0.5rem; }
        }
    </style>
    
    <script>
        if (localStorage.getItem('theme') === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); }
    </script>
</head>
<body>

    <header id="siteHeader">
        <a href="/" class="brand">
            <div class="logo-symbol">&sum;</div>
            <div class="brand-title">thequantcals</div>
        </a>

        <!-- Desktop navigation links -->
        <nav class="desktop-nav" id="desktopNav"></nav>
        
        <div class="nav-actions">
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle Night Mode">🌙</button>
            <!-- Mobile hamburger button -->
            <button class="menu-btn" id="menuBtn" aria-label="Open Navigation Menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <!-- Mobile slide-out menu -->
    <nav class="nav-menu" id="navMenu">
        <button id="closeMenuBtn" class="close-menu-btn" aria-label="Close Menu">×</button>
        <div class="lbl">Menu</div>
        <div id="mobileMenuLinks" style="display:flex;flex-direction:column;gap:1.1rem"></div>
    </nav>

    <div class="wrapper">
        <div class="layout-grid">
            
            <main class="main-body">
                {{ content }}
            </main>

            <aside class="sidebar">
                <h3>🔥 Popular Tools</h3>
                <ul class="sidebar-list">
                    <li><a href="/tools/Compound-Interest-Calculator.html">⭐ Compound Interest</a></li>
                    <li><a href="/tools/accurate-age-calculator.html">⭐ Age Calculator</a></li>
                    <li><a href="/tools/Exam-Marks-Percentage-Calculator.html">⭐ Exam Marks Calculator</a></li>
                </ul>
                
                <h3 style="margin-top: 2rem;">System Status</h3>
                <p style="font-size: 0.88rem; color: var(--text-muted); line-height: 1.5;">
                    All tools process locally in your browser.
                </p>
            </aside>

        </div>
    </div>

    <footer>
        <p>&copy; 2026 thequantcals. All rights reserved.</p>
        <nav>
            <a href="/privacy-policy.html">Privacy Policy</a>
            <a href="/terms-of-service.html">Terms of Service</a>
            <a href="/disclaimer.html">Disclaimer</a>
            <a href="/contact.html">Contact Us</a>
        </nav>
    </footer>

    <script>
        /* Dark mode */
        const themeToggle = document.getElementById('themeToggle');
        const htmlEl = document.documentElement;
        if (localStorage.getItem('theme') === 'dark') { themeToggle.textContent = '☀️'; }
        themeToggle.addEventListener('click', () => {
            if (htmlEl.getAttribute('data-theme') === 'dark') {
                htmlEl.setAttribute('data-theme', 'light'); themeToggle.textContent = '🌙'; localStorage.setItem('theme', 'light');
            } else {
                htmlEl.setAttribute('data-theme', 'dark'); themeToggle.textContent = '☀️'; localStorage.setItem('theme', 'dark');
            }
        });

        /* Hamburger menu toggling */
        const navMenu = document.getElementById('navMenu');
        document.addEventListener('click', (e) => {
            const t = e.target;
            if (t.closest('#menuBtn')) { navMenu.classList.toggle('active'); return; }
            if (t.closest('#closeMenuBtn') || t.closest('#navMenu a') || !t.closest('#navMenu')) { navMenu.classList.remove('active'); }
        });
        window.addEventListener('resize', () => navMenu.classList.remove('active'));

        /* Universal Navigation Builder with Fallbacks */
        (function() {
            const FIRST = ['financial', 'math', 'utility'];
            const SHORT = { financial: 'Finance' };
            const ICON = { financial: '📈', math: '📐', utility: '🧰' };
            
            function pretty(s) {
                return s.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
            }

            let cats = [...FIRST];
            try {
                const cached = JSON.parse(localStorage.getItem('qc_tree'));
                if (cached && cached.p) {
                    const ex = [];
                    cached.p.forEach(p => {
                        const m = p.match(/^tools\/([^\/]+)\/.+\.html$/i);
                        if (!m) return;
                        let k = m[1].toLowerCase();
                        if (k === 'finance') k = 'financial';
                        if (!FIRST.includes(k) && !ex.includes(k)) ex.push(k);
                    });
                    ex.sort().forEach(k => cats.push(k));
                }
            } catch (e) {}

            // Build Desktop Nav (Finance, Math, Utility, More)
            let desktopHtml = '';
            FIRST.forEach(c => {
                const label = SHORT[c] || pretty(c);
                desktopHtml += `<a href="/#/${c}">${label}</a>`;
            });
            desktopHtml += `<a href="/#/all">More</a>`;
            document.getElementById('desktopNav').innerHTML = desktopHtml;

            // Build Mobile Slide-out Menu
            let mobileHtml = `<a href="/">🏠 Home</a>`;
            cats.forEach(c => {
                const icon = ICON[c] || '🗂️';
                const label = pretty(c);
                mobileHtml += `<a href="/#/${c}">${icon} ${label}</a>`;
            });
            mobileHtml += `<a href="/#/all">📋 All Calculators</a>`;
            document.getElementById('mobileMenuLinks').innerHTML = mobileHtml;
        })();
    </script>
</body>
</html>
